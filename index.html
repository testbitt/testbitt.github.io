<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kamu Kamu Standard Libary</title><meta name="theme-color" content="#0f6b4f"><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#eef7f2;color:#12372b;display:grid;place-items:center;min-height:100vh}.box{background:#fff;padding:28px 32px;border-radius:22px;box-shadow:0 18px 50px #0f6b4f22;text-align:center;max-width:520px}.logo{width:72px;height:72px;border-radius:22px;background:#0f6b4f;color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;margin:auto auto 14px}.spin{display:inline-block;width:22px;height:22px;border:3px solid #b8dfcf;border-top-color:#0f6b4f;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="logo">KSL</div><h2>Kamu Kamu Standard Libary</h2><p>กำลังโหลดหลักสูตร...</p><div class="spin"></div><p id="msg" style="font-size:13px;color:#678">Holding Time • สูตรการผลิต • สูตรชงเครื่องดื่ม</p></div><script>
(async()=>{try{const files=["payload-01.txt","payload-02.txt","payload-03.txt","payload-04.txt","payload-05.txt","payload-06.txt","payload-07.txt","payload-08.txt"];const chunks=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('โหลด '+f+' ไม่สำเร็จ');return r.text()})));const b64=chunks.join('');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));let html;if('DecompressionStream' in window){const ds=new DecompressionStream('gzip');html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text()}else{await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';s.onload=ok;s.onerror=fail;document.head.appendChild(s)});html=pako.ungzip(bytes,{to:'string'})}const gas='https://script.google.com/macros/s/AKfycbySkH0Fn2P757EJM_bDNYNkQx-Ieq6IAa9e0uSz1WOPt4u8eL4dP7pr3iBH0lqn6zxD/exec';html=html.replace("settings:{passScore:80,syncEnabled:false,gasUrl:'',syncKey:''}",`settings:{passScore:80,syncEnabled:true,gasUrl:'${gas}',syncKey:''}`);html=html.replace("const defaultSettings={passScore:80,syncEnabled:false,gasUrl:'',syncKey:''};",`const defaultSettings={passScore:80,syncEnabled:true,gasUrl:'${gas}',syncKey:''};`);html=html.replace("// V2 -> V3 migration: seed the two new recipe databases automatically.",`// Google Sheets deployment migration\n    let syncConfigChanged=false;\n    if(appState.settings.gasUrl!=='${gas}'){appState.settings.gasUrl='${gas}';appState.settings.syncEnabled=true;syncConfigChanged=true}\n    if(syncConfigChanged){await dbSet(appState);setTimeout(()=>syncAllTrainingDataNow(),900)}\n    // V2 -> V3 migration: seed the two new recipe databases automatically.`);html=html.replace("app:'KAMU-KAMU-STANDARD-LIBARY-V3.3'","app:'KSL-V3.4'");document.open();document.write(html);document.close()}catch(e){console.error(e);document.getElementById('msg').textContent='โหลดระบบไม่สำเร็จ: '+e.message}})();
</script></body></html>
