<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Kamu Kamu Standard Libary</title>
<meta name="theme-color" content="#0f6b4f">
<script>
(()=>{
  const APP_VERSION='51';
  const u=new URL(location.href);
  if(u.searchParams.get('app')!==APP_VERSION){
    u.searchParams.set('app',APP_VERSION);
    location.replace(u.pathname+'?'+u.searchParams.toString()+u.hash);
  }
})();
</script>
<style>
html,body{margin:0;min-height:100%;background:#f6faf7;color:#173d30;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif}
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 12% 10%,#fff0f4 0,transparent 24%),radial-gradient(circle at 88% 8%,#fff7d9 0,transparent 25%),linear-gradient(180deg,#fbfdfb,#eef7f1)}
.ksl-boot{width:min(560px,calc(100% - 36px));box-sizing:border-box;background:rgba(255,255,255,.96);border:1px solid #d2e7dc;border-radius:26px;padding:34px 30px;text-align:center;box-shadow:0 18px 55px rgba(24,86,61,.10)}
.ksl-logo{width:78px;height:78px;margin:0 auto 15px;border-radius:24px;background:linear-gradient(145deg,#0f6b4f,#339271);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:1000;box-shadow:0 10px 24px rgba(15,107,79,.18)}
.ksl-boot h1{font-size:24px;margin:0 0 6px;color:#173d30}.ksl-boot p{margin:0;color:#6b8077;font-size:14px}.ksl-dots{display:flex;justify-content:center;gap:7px;margin:20px 0 14px}.ksl-dots i{width:8px;height:8px;border-radius:99px;background:#41ae84;animation:p 1s infinite alternate}.ksl-dots i:nth-child(2){animation-delay:.16s}.ksl-dots i:nth-child(3){animation-delay:.32s}@keyframes p{to{opacity:.25;transform:translateY(-5px)}}
#msg{font-size:12px!important;color:#7b8f86!important}
</style>
</head>
<body>
<div class="ksl-boot" id="bootScreen">
  <div class="ksl-logo">KSL</div>
  <h1>Kamu Kamu Standard Libary</h1>
  <p>กำลังเปิดหน้าหลักสูตรเวอร์ชันล่าสุด</p>
  <div class="ksl-dots"><i></i><i></i><i></i></div>
  <p id="msg">Holding Time • สูตรการผลิต • สูตรชงเครื่องดื่ม</p>
</div>
<script>
(async()=>{
  const VERSION='v51-direct-new-home';
  const PATCHES=[
    'patch-v39.js?v=51',
    'patch-v40.js?v=51',
    'patch-v41.js?v=51',
    'patch-v42.js?v=51',
    'patch-v44.js?v=51',
    'patch-v45.js?v=51',
    'patch-v46.js?v=51',
    'patch-v48.js?v=51',
    'patch-v49.js?v=51',
    'patch-v50.js?v=51'
  ];

  function loadScript(src){
    return new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src=src;
      s.async=false;
      s.onload=()=>resolve(src);
      s.onerror=()=>reject(new Error('โหลด '+src+' ไม่สำเร็จ'));
      document.body.appendChild(s);
    });
  }

  function waitForNewHome(timeout=3000){
    return new Promise(resolve=>{
      const start=Date.now();
      const tick=()=>{
        const home=document.getElementById('home');
        const banner=home?.querySelector('.ksl-v49-banner-wrap');
        if(home&&banner) return resolve(true);
        if(Date.now()-start>=timeout) return resolve(false);
        requestAnimationFrame(tick);
      };
      tick();
    });
  }

  function showFatal(err){
    console.error(err);
    document.documentElement.style.visibility='visible';
    document.body.innerHTML=`<div class="ksl-boot"><div class="ksl-logo">KSL</div><h1>เปิดระบบไม่สำเร็จ</h1><p>${String(err?.message||err)}</p><div style="margin-top:18px"><button onclick="location.replace('/?app=51&t='+Date.now())" style="border:0;border-radius:14px;padding:12px 18px;background:#0f6b4f;color:#fff;font-weight:800;cursor:pointer">ลองเปิดใหม่</button></div></div>`;
  }

  try{
    const files=['payload-01.txt','payload-02.txt','payload-03.txt','payload-04.txt','payload-05.txt','payload-06.txt','payload-07.txt','payload-08.txt'];
    const parts=await Promise.all(files.map(f=>fetch(f+'?v='+VERSION,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error('โหลด '+f+' ไม่สำเร็จ ('+r.status+')');
      return r.text();
    })));

    const bin=atob(parts.join(''));
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    if(!('DecompressionStream' in window)) throw new Error('กรุณาใช้ Chrome หรือ Edge รุ่นล่าสุด');

    let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    if(!/<html/i.test(html)) throw new Error('ไฟล์หลักสูตรไม่สมบูรณ์');

    /* Prevent the legacy UI from ever being painted. */
    const bootHide='<style id="kslBootHide">html{visibility:hidden!important;background:#f6faf7!important}</style>';
    html=html.replace(/<head([^>]*)>/i,'<head$1>'+bootHide);

    document.open();
    document.write(html);
    document.close();

    const permanentHide=document.createElement('style');
    permanentHide.id='kslPermanentHide';
    permanentHide.textContent='#loginGate,#userPill,#resultProfileStrip{display:none!important}';
    document.head.appendChild(permanentHide);

    for(const src of PATCHES){
      await loadScript(src);
    }

    if(typeof window.goPage==='function') window.goPage('home');
    else if(typeof goPage==='function') goPage('home');

    await waitForNewHome();
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

    document.getElementById('kslBootHide')?.remove();
    document.documentElement.style.visibility='visible';
    window.scrollTo({top:0,left:0,behavior:'instant'});

    /* Keep the visible URL clean after the versioned navigation has loaded. */
    if(history.replaceState) history.replaceState(null,'','/');
  }catch(err){
    showFatal(err);
  }
})();
</script>
</body>
</html>
