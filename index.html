<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kamu Kamu Standard Libary</title>
<meta name="theme-color" content="#0f6b4f">
<style>
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#eef7f2;color:#12372b;display:grid;place-items:center;min-height:100vh}
.box{background:#fff;padding:28px 32px;border-radius:22px;box-shadow:0 18px 50px #0f6b4f22;text-align:center;max-width:520px}
.logo{width:72px;height:72px;border-radius:22px;background:#0f6b4f;color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;margin:auto auto 14px}
.spin{display:inline-block;width:22px;height:22px;border:3px solid #b8dfcf;border-top-color:#0f6b4f;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="logo">KSL</div><h2>Kamu Kamu Standard Libary</h2><p>กำลังโหลดหลักสูตร...</p><div class="spin"></div><p id="msg" style="font-size:13px;color:#678">Holding Time • สูตรการผลิต • สูตรชงเครื่องดื่ม</p></div>
<script>
(async()=>{
 try{
  const ver='v39-sidebar-flash-b';
  const files=['payload-01.txt','payload-02.txt','payload-03.txt','payload-04.txt','payload-05.txt','payload-06.txt','payload-07.txt','payload-08.txt'];
  const parts=await Promise.all(files.map(f=>fetch(f+'?v='+ver,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('โหลด '+f+' ไม่สำเร็จ ('+r.status+')');return r.text()})));
  const bin=atob(parts.join(''));
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  if(!('DecompressionStream' in window)) throw new Error('Browser นี้ไม่รองรับการเปิดหลักสูตร กรุณาใช้ Chrome/Edge รุ่นล่าสุด');
  const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  if(!html.includes('<!DOCTYPE html>')&&!html.includes('<!doctype html>')) throw new Error('ไฟล์หลักสูตรไม่สมบูรณ์');
  document.open();document.write(html);document.close();
  const hide=document.createElement('style');hide.textContent='#loginGate,#userPill,#resultProfileStrip{display:none!important}';document.head.appendChild(hide);
  const patch=document.createElement('script');patch.src='patch-v39.js?v=39b';patch.async=false;document.body.appendChild(patch);
 }catch(e){console.error(e);const msg=document.getElementById('msg');if(msg)msg.innerHTML='เปิดระบบไม่สำเร็จ<br><b>'+String(e.message||e)+'</b><br><small>กรุณารีเฟรชหน้าเว็บอีกครั้ง</small>';}
})();
</script>
</body>
</html>
<!-- deploy-v39b -->
