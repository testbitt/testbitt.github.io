<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Kamu Kamu Standard Libary</title>
<meta name="theme-color" content="#0f6b4f">
<style>
html,body{margin:0;min-height:100%;background:#f6faf7;color:#173d30;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif}
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 12% 10%,#fff0f4 0,transparent 24%),radial-gradient(circle at 88% 8%,#fff7d9 0,transparent 25%),linear-gradient(180deg,#fbfdfb,#eef7f1)}
.ksl-boot{width:min(520px,calc(100% - 32px));box-sizing:border-box;background:rgba(255,255,255,.97);border:1px solid #d2e7dc;border-radius:24px;padding:28px 26px;text-align:center;box-shadow:0 18px 55px rgba(24,86,61,.10)}
.ksl-logo{width:68px;height:68px;margin:0 auto 13px;border-radius:21px;background:linear-gradient(145deg,#0f6b4f,#339271);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:1000;box-shadow:0 10px 24px rgba(15,107,79,.18)}
.ksl-boot h1{font-size:22px;margin:0 0 5px;color:#173d30}.ksl-boot p{margin:0;color:#6b8077;font-size:13px}.ksl-progress{height:7px;background:#e8f2ed;border-radius:99px;overflow:hidden;margin:18px 0 10px}.ksl-progress i{display:block;width:36%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#0f6b4f,#55bd91);animation:load 1s ease-in-out infinite alternate}@keyframes load{to{width:88%}}
</style>
</head>
<body>
<div class="ksl-boot" id="bootScreen">
  <div class="ksl-logo">KSL</div>
  <h1>Kamu Kamu Standard Libary</h1>
  <p>กำลังเปิดระบบ...</p>
  <div class="ksl-progress"><i></i></div>
  <p id="msg">Holding Time • สูตรการผลิต • สูตรชงเครื่องดื่ม</p>
</div>
<script>
(async()=>{
  const VERSION='v52-fast';
  const SHELL_CACHE_KEY='KSL_APP_SHELL_V52';
  const CORE_PATCHES=[
    'patch-v39.js?v=52','patch-v40.js?v=52','patch-v41.js?v=52',
    'patch-v42.js?v=52','patch-v44.js?v=52','patch-v45.js?v=52',
    'patch-v46.js?v=52','patch-v48.js?v=52','patch-v49.js?v=52'
  ];

  function loadOrderedScripts(sources){
    const promises=[];
    for(const src of sources){
      const s=document.createElement('script');
      s.src=src;
      s.async=false;
      promises.push(new Promise((resolve,reject)=>{
        s.onload=()=>resolve(src);
        s.onerror=()=>reject(new Error('โหลด '+src+' ไม่สำเร็จ'));
      }));
      document.body.appendChild(s);
    }
    return Promise.all(promises);
  }

  function loadHQInBackground(){
    const run=()=>{
      const s=document.createElement('script');
      s.src='patch-v50.js?v=52';
      s.async=true;
      s.onerror=()=>console.warn('Banner HQ โหลดไม่สำเร็จ ใช้ภาพสำรองแทน');
      document.body.appendChild(s);
    };
    if('requestIdleCallback' in window) requestIdleCallback(run,{timeout:1800});
    else setTimeout(run,650);
  }

  async function getShell(){
    try{
      const cached=localStorage.getItem(SHELL_CACHE_KEY);
      if(cached && /<html/i.test(cached)) return cached;
    }catch(_){ }

    const files=['payload-01.txt','payload-02.txt','payload-03.txt','payload-04.txt','payload-05.txt','payload-06.txt','payload-07.txt','payload-08.txt'];
    const parts=await Promise.all(files.map(f=>fetch(f+'?v='+VERSION,{cache:'force-cache'}).then(r=>{
      if(!r.ok) throw new Error('โหลด '+f+' ไม่สำเร็จ ('+r.status+')');
      return r.text();
    })));
    const bin=atob(parts.join(''));
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    if(!('DecompressionStream' in window)) throw new Error('กรุณาใช้ Chrome หรือ Edge รุ่นล่าสุด');
    const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    if(!/<html/i.test(html)) throw new Error('ไฟล์หลักสูตรไม่สมบูรณ์');
    try{ localStorage.setItem(SHELL_CACHE_KEY,html); }catch(_){ }
    return html;
  }

  function showFatal(err){
    console.error(err);
    document.documentElement.style.visibility='visible';
    document.body.innerHTML='<div class="ksl-boot"><div class="ksl-logo">KSL</div><h1>เปิดระบบไม่สำเร็จ</h1><p>'+String(err?.message||err)+'</p><div style="margin-top:16px"><button onclick="localStorage.removeItem(\''+SHELL_CACHE_KEY+'\');location.reload()" style="border:0;border-radius:14px;padding:12px 18px;background:#0f6b4f;color:#fff;font-weight:800;cursor:pointer">ลองเปิดใหม่</button></div></div>';
  }

  try{
    let html=await getShell();
    const bootHide='<style id="kslBootHide">html{visibility:hidden!important;background:#f6faf7!important}</style>';
    html=html.replace(/<head([^>]*)>/i,'<head$1>'+bootHide);

    document.open();document.write(html);document.close();

    const hide=document.createElement('style');
    hide.id='kslPermanentHide';
    hide.textContent='#loginGate,#userPill,#resultProfileStrip{display:none!important}';
    document.head.appendChild(hide);

    await loadOrderedScripts(CORE_PATCHES);

    if(typeof window.goPage==='function') window.goPage('home');
    else if(typeof goPage==='function') goPage('home');

    await new Promise(resolve=>{
      const start=performance.now();
      const tick=()=>{
        const ready=document.querySelector('#home .ksl-v49-banner-wrap');
        if(ready || performance.now()-start>1000) return resolve();
        requestAnimationFrame(tick);
      };
      tick();
    });

    document.getElementById('kslBootHide')?.remove();
    document.documentElement.style.visibility='visible';
    window.scrollTo(0,0);
    loadHQInBackground();
  }catch(err){showFatal(err)}
})();
</script>
</body>
</html>
<!-- deploy-v52-fast -->
