name: Admin Filter Only

on:
  push:
    paths:
      - '.github/workflows/admin-filter-only-20260914.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Admin behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('travel-expense/admin.js')
          s=p.read_text()
          start=s.index('  function currentBangkokMonth(){')
          end=s.index('  function openAdminLogin(){', start)
          showhome_start=s.rfind('  function showHome(){',0,start)
          showhome=s[showhome_start:start]
          replacement="""  function showAdmin(){\n    ['home','travel','ot','travelSummary','otSummary'].forEach(id=>$(id)?.classList.add('hidden'));\n    $('adminSummary').classList.remove('hidden');\n    clearTravel();clearOT();\n    scrollTo(0,0);\n  }\n  function switchTab(tab){\n    const travel=tab==='travel';\n    $('adminTravelPanel').classList.toggle('hidden',!travel);$('adminOTPanel').classList.toggle('hidden',travel);\n    $('tabTravel').classList.toggle('active',travel);$('tabOT').classList.toggle('active',!travel);\n  }\n\n"""
          s=s[:showhome_start]+showhome+replacement+s[end:]
          p.write_text(s)

          idx=Path('travel-expense/index.html')
          h=idx.read_text()
          h=re.sub(r'admin\.js\?v=[^"<]+','admin.js?v=20260914-admin-filter-only',h)
          idx.write_text(h)
          PY
          node --check travel-expense/admin.js
          grep -q 'admin.js?v=20260914-admin-filter-only' travel-expense/index.html
          ! grep -q 'currentBangkokMonth' travel-expense/admin.js
          ! grep -q 'setTimeout(()=>searchTravel(),0)' travel-expense/admin.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add travel-expense/admin.js travel-expense/index.html
          git commit -m 'Show Admin reports only after Filter search'
          git push
