name: KAMU Inventory Source Export

on:
  pull_request:
    paths:
      - 'kamu-source-export/**'
      - '.github/workflows/kamu-source-export.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="_export/KAMU_Inventory_Stock_Checker_Source_v3.38"
          mkdir -p "$ROOT/frontend" "$ROOT/source-history/tools" "$ROOT/source-history/.github/workflows"
          cp -a kamu-inventory-stock-checker-mirror/. "$ROOT/frontend/"
          cp tools/kamu-inventory-* "$ROOT/source-history/tools/" || true
          cp .github/workflows/kamu-inventory-mirror.yml "$ROOT/source-history/.github/workflows/"
          cp -a kamu-source-export/. "$ROOT/"
          curl -L --fail --silent --show-error 'https://www.jobbkk.com/upload/employer/0A/ADA/00DADA/images/56026.png' -o "$ROOT/frontend/assets/kamu-logo.png" || true
          printf 'KAMU Inventory Stock Checker Source Export\nProduction version: 3.38\nExport date: 2026-10-30\n' > "$ROOT/SOURCE_VERSION.txt"
          FAIL=0
          for f in "$ROOT"/frontend/assets/*.js; do node --check "$f" >/dev/null 2>&1 || { echo "SYNTAX_FAIL $f"; FAIL=1; }; done
          test "$FAIL" -eq 0
          (cd "$ROOT" && find . -type f ! -name FILE_MANIFEST_SHA256.txt -print0 | sort -z | xargs -0 sha256sum > FILE_MANIFEST_SHA256.txt)
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAMU_Inventory_Stock_Checker_Source_v3.38
          path: _export/KAMU_Inventory_Stock_Checker_Source_v3.38/
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
