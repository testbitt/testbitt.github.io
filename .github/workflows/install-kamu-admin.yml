name: Install KAMU Admin

on:
  push:
    paths:
      - '.github/workflows/install-kamu-admin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Admin assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('travel-expense/index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./admin.css?v=20260821-admin1">'
          js='<script src="./admin.js?v=20260821-admin1"></script><script>window.initKamuAdmin&&window.initKamuAdmin()</script>'
          if 'admin.css?v=20260821-admin1' not in s:
              s=s.replace('</head>',css+'</head>')
          if 'admin.js?v=20260821-admin1' not in s:
              s=s.replace('</body>',js+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -F 'admin.css?v=20260821-admin1' travel-expense/index.html
          grep -F 'admin.js?v=20260821-admin1' travel-expense/index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add travel-expense/index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Load KAMU admin summary dashboard'
            git push
          fi