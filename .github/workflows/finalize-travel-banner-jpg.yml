name: Finalize Exact KAMU Banner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-travel-banner-jpg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble exact banner and verify bytes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pillow --quiet
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, re

          files=sorted(
              Path('travel-expense').glob('final-banner-part*.b64'),
              key=lambda p:int(re.search(r'(\d+)', p.stem).group(1))
          )
          assert len(files) == 8, f'Expected 8 banner parts, found {len(files)}'
          encoded=''.join(''.join(p.read_text().split()) for p in files)
          raw=base64.b64decode(encoded, validate=True)
          target=Path('travel-expense/banner-kamu-final.webp')
          target.write_bytes(raw)

          sha=hashlib.sha256(raw).hexdigest()
          print('SHA256',sha)
          assert sha == '18816578709670d0cad15fec06bd0fc19be36302c85a39e395bf24085064cd1b', 'Banner checksum mismatch'
          assert len(raw) == 56436, f'Unexpected banner size: {len(raw)}'

          im=Image.open(target)
          assert im.format == 'WEBP', im.format
          assert im.size == (1000,429), im.size
          im.verify()
          print('VERIFIED_WEBP 1000 429 56436')
          PY

      - name: Point website to exact verified banner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('travel-expense/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(
              r'src="\./(?:banner-exact\.webp|banner-kamu-staff-final\.webp|banner-travel-ot-vector\.svg|kamu-banner\.webp|banner-travel-ot\.jpg|banner-kamu-final\.webp)(?:\?v=[^"]*)?"',
              'src="./banner-kamu-final.webp?v=20260816-final3"',
              s,
              count=1
          )
          s=re.sub(r'aspect-ratio:\s*\d+\s*/\s*\d+', 'aspect-ratio:1000/429', s)
          s=re.sub(
              r'width="\d+" height="\d+" loading="eager" fetchpriority="high"',
              'width="1000" height="429" loading="eager" fetchpriority="high"',
              s,
              count=1
          )
          assert 'banner-kamu-final.webp?v=20260816-final3' in s
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit verified banner and page
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add travel-expense/banner-kamu-final.webp travel-expense/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Use exact verified KAMU anime banner'
            git push
          fi
