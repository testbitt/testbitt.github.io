name: Finalize Travel Banner JPG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-travel-banner-jpg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify JPG
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pillow --quiet
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, re
          files=sorted(Path('travel-expense').glob('jpg-part*.txt'), key=lambda p:int(re.search(r'(\d+)',p.stem).group(1)))
          assert files, 'No JPG chunks found'
          out=bytearray()
          for p in files:
              s=''.join(p.read_text().split())
              print('CHUNK',p.name,'chars',len(s),'mod4',len(s)%4,'head',s[:8],'tail',s[-8:])
              try:
                  b=base64.b64decode(s, validate=True)
              except Exception as e:
                  raise SystemExit(f'Invalid chunk {p.name}: {e}')
              print(' decoded',len(b),'bytes')
              out.extend(b)
          target=Path('travel-expense/banner-travel-ot.jpg')
          target.write_bytes(out)
          print('JPG_BYTES',len(out))
          im=Image.open(target); im.verify()
          im=Image.open(target); w,h=im.size
          print('VERIFIED_JPG',w,h,target.stat().st_size)
          assert w >= 900 and h >= 380
          assert target.stat().st_size > 100000
          PY

      - name: Point website to verified JPG
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re
          p=Path('travel-expense/index.html')
          s=p.read_text(encoding='utf-8')
          w,h=Image.open('travel-expense/banner-travel-ot.jpg').size
          s=re.sub(r'src="\./(?:banner-exact\.webp|banner-kamu-staff-final\.webp|banner-travel-ot-vector\.svg|kamu-banner\.webp|banner-travel-ot\.jpg)(?:\?v=[^"]*)?"', 'src="./banner-travel-ot.jpg?v=20260816-verified-jpg2"', s, count=1)
          s=re.sub(r'aspect-ratio:\s*\d+\s*/\s*\d+', f'aspect-ratio:{w}/{h}', s)
          s=re.sub(r'width="\d+" height="\d+" loading="eager" fetchpriority="high"', f'width="{w}" height="{h}" loading="eager" fetchpriority="high"', s, count=1)
          p.write_text(s,encoding='utf-8')
          assert 'banner-travel-ot.jpg?v=20260816-verified-jpg2' in s
          PY

      - name: Commit verified JPG and HTML
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add travel-expense/banner-travel-ot.jpg travel-expense/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Use verified JPG anime travel OT banner'
            git push
          fi
