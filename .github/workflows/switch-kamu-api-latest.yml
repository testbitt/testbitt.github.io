name: Switch KAMU API Latest

on:
  push:
    paths:
      - '.github/workflows/switch-kamu-api-latest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Apps Script URLs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          new = 'https://script.google.com/macros/s/AKfycbx_FWk2tZ-m2riA_Tfqs2OBXcTcFxQ5pfZE8_EG0HdI-CU8-jmAwztUH32DPTOWc0CV/exec'
          for file in ['travel-expense/index.html', 'travel-expense/summary.js']:
              p = Path(file)
              s = p.read_text(encoding='utf-8')
              s2, n = re.subn(r'https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec', new, s)
              if n:
                  p.write_text(s2, encoding='utf-8')
                  print(file, 'replaced', n, 'URL(s)')
              else:
                  print(file, 'no Apps Script URL found')
          PY
      - name: Verify latest API is present
        run: |
          grep -F 'AKfycbx_FWk2tZ-m2riA_Tfqs2OBXcTcFxQ5pfZE8_EG0HdI-CU8-jmAwztUH32DPTOWc0CV' travel-expense/index.html
          grep -F 'AKfycbx_FWk2tZ-m2riA_Tfqs2OBXcTcFxQ5pfZE8_EG0HdI-CU8-jmAwztUH32DPTOWc0CV' travel-expense/summary.js
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add travel-expense/index.html travel-expense/summary.js
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Use latest Apps Script backend for KAMU Travel OT'
            git push
          fi
