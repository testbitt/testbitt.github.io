name: Upgrade KAMU voice IDs and anime tone
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upgrade-kamu-voice-id-anime.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch employee ID display
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('travel-expense/voice-assistant.js')
          s = p.read_text()

          old = "      state.employeeId=id;\n      setStatus(`กำลังตรวจสอบรหัสพนักงาน ${id}...`);"
          new = "      state.employeeId=id;\n      setHeard(`รหัสพนักงาน: ${id}`);\n      setStatus(`กำลังตรวจสอบรหัสพนักงาน ${id}...`);"
          if old in s:
              s = s.replace(old, new, 1)
          elif "setHeard(`รหัสพนักงาน: ${id}`);" not in s:
              raise SystemExit('employee ID display insertion point not found')

          p.write_text(s)

          idx = Path('travel-expense/index.html')
          t = idx.read_text()
          t = re.sub(r'voice-assistant\.js\?v=[^\"]+', 'voice-assistant.js?v=20260831-voice11-english-id', t)
          idx.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add travel-expense/voice-assistant.js travel-expense/index.html
          git diff --cached --quiet || git commit -m "Show recognized employee IDs in English format"
          git push