name: Upgrade KAMU voice IDs and anime tone
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upgrade-kamu-voice-id-anime.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch voice assistant
        run: |
          python3 - <<'PY'
          import base64
          code=base64.b64decode(' uZmluZCgiICBmdW5jdGlvbiBlbXBsb3llZUlkU3BlZWNoKGlkKXsiKQpiPXM   ').decode()
          exec(code)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add travel-expense/voice-assistant.js travel-expense/index.html
          git diff --cached --quiet || git commit -m "Ask employee ID simply and confirm after recognition"
          git push
