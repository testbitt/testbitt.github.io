name: Run KAMU voice v15 fix
on:
  push:
    paths:
      - '.github/workflows/run-fix-kamu-voice-v15.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 .github/scripts/fix_voice_v15.py
      - run: node --check travel-expense/voice-assistant.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add travel-expense/voice-assistant.js travel-expense/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix iOS voice LINE Android mic and lookup speed'
          git push