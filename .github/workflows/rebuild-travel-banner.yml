name: Rebuild Travel Banner HD

on:
  push:
    branches: [main]
    paths:
      - 'travel-expense/banner-hd-part*.txt'
      - '.github/workflows/rebuild-travel-banner.yml'

permissions:
  contents: write

jobs:
  rebuild-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild 1200px WebP banner
        shell: bash
        run: |
          set -euo pipefail
          cat travel-expense/banner-hd-part{1..7}.txt | tr -d '\r\n[:space:]' > /tmp/kamu-banner.b64
          base64 --decode /tmp/kamu-banner.b64 > travel-expense/kamu-banner.webp
          echo "Banner bytes: $(stat -c%s travel-expense/kamu-banner.webp)"
          file travel-expense/kamu-banner.webp
          test "$(stat -c%s travel-expense/kamu-banner.webp)" -gt 80000

      - name: Commit HD banner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add travel-expense/kamu-banner.webp
          if git diff --cached --quiet; then
            echo "Banner already up to date"
            exit 0
          fi
          git commit -m "Rebuild travel banner in HD"
          git push
