name: Bump Voice Assistant V4
on:
  push:
    paths:
      - '.github/workflows/bump-travel-voice-v4.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump voice cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('travel-expense/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'voice-assistant\.js\?v=[^"\'<>\s]+','voice-assistant.js?v=20260831-voice4',s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add travel-expense/index.html
          git diff --cached --quiet || git commit -m 'Bump Travel voice assistant cache v4'
          git push
