name: Refresh Voice Assistant Daily Detail Cache
on:
  push:
    paths:
      - '.github/workflows/refresh-voice6-20260831.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh voice cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('travel-expense/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'voice-assistant\.js\?v=[^"\']+', 'voice-assistant.js?v=20260831-voice6-daily', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add travel-expense/index.html
          git diff --cached --quiet || git commit -m 'Load Voice Assistant daily detail version'
          git push