<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>KAMU Holding Time Checker</title>
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:#f5f7fb;color:#172033}.load{max-width:620px;margin:60px auto;padding:24px;text-align:center}.spin{width:34px;height:34px;margin:0 auto 16px;border:4px solid #e4e7ec;border-top-color:#111827;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head>
<body><div class="load"><div class="spin"></div><b>กำลังโหลด KAMU Holding Time Checker Version 1.4</b><div style="margin-top:8px;color:#667085;font-size:13px">เตรียมระบบอ่านช่อง “รายการ” ก่อนเป็นอันดับแรก...</div></div>
<script>
(async()=>{
  const base='https://raw.githubusercontent.com/testbitt/testbitt.github.io/abcfc5d6ce7ffc69f235207f7215b030f3b80ec5/holding-time-checker/index.html';
  let h=await fetch(base,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('โหลดระบบหลักไม่สำเร็จ');return r.text()});
  const rep=(a,b)=>{if(!h.includes(a))throw Error('ไม่พบจุดอัปเดตระบบ');h=h.replace(a,b)};
  rep('Version 1.3','Version 1.4');
  rep('ระบบปรับภาพให้เหมาะกับ OCR ก่อนอ่าน และใช้ภาษาไทย + English พร้อมกัน','ระบบจะอ่าน “ช่องรายการ” ก่อนเป็นอันดับแรก แล้วจึงอ่านข้อความส่วนอื่นของฉลากเพื่อยืนยันวันเวลาและเงื่อนไข');
  rep('เพื่อให้อ่านเร็วขึ้น ระบบจะย่อภาพขนาดใหญ่อัตโนมัติและเพิ่มความคมชัดก่อน OCR หากผลอ่านรอบแรกมีข้อความน้อยหรือความมั่นใจต่ำ ระบบจะอ่านซ้ำอีกแบบเฉพาะกรณีจำเป็นเพื่อเก็บข้อความให้ครบขึ้น','ลำดับการอ่านใหม่: 1) โฟกัสบริเวณช่อง “รายการ” และจับคู่ชื่อวัตถุดิบกับฐานข้อมูลก่อน 2) อ่านทั้งฉลากเพื่อเก็บวันที่ เวลา สถานะ และ Key Word เพิ่มเติม 3) ใช้ข้อมูลส่วนอื่นช่วยยืนยันเงื่อนไขและคำนวณวันหมดอายุ');
  rep('ไม่ต้องอ่านชื่อสินค้าได้ตรง 100% ระบบวิเคราะห์ข้อความทั้งหมดที่สแกนได้ทั้งภาษาไทยและอังกฤษ แล้วค้นหาเงื่อนไขที่น่าจะตรงกับฐานข้อมูล','ระบบให้น้ำหนัก “ข้อความในช่องรายการ” สูงสุด แม้ OCR อ่านชื่อไม่ตรง 100% แล้วใช้ข้อความส่วนอื่นของฉลากเป็นข้อมูลประกอบเพื่อเรียงเงื่อนไขที่น่าจะถูกต้อง');
  h=h.replace(/🔎 อ่านและวิเคราะห์รูป/g,'🔎 อ่านช่องรายการก่อน + วิเคราะห์').replace('🔎 วิเคราะห์</button>','🔎 อ่านรายการ</button>');
  rep("let db=[],currentImage=null,currentImageUrl='',selectedRow=null,lastOCR='',lastCandidates=[],lastResult=null,ocrWorker=null,ocrWorkerPromise=null,ocrBusy=false;","let db=[],currentImage=null,currentImageUrl='',selectedRow=null,lastOCR='',lastItemOCR='',itemPriorityName='',itemPriorityScore=0,lastCandidates=[],lastResult=null,ocrWorker=null,ocrWorkerPromise=null,ocrBusy=false;");

  const scoreBlock=`  function cleanItemRegionText(text){const lines=thaiDigits(String(text||'')).split(/\\n+/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^(?:รายการ|item|product|product name)\\s*[:：\\-]?\\s*/i,'').trim()).filter(x=>x&&!/^(?:จำนวน|qty|quantity|ผู้ผลิต|producer|สาขา|branch|วันที่|date|เวลา|time|สูตร)\\b/i.test(x)&&!/^\\d{1,2}\\s*[\\/\\-.]\\s*\\d{1,2}\\s*[\\/\\-.]\\s*\\d{4}$/.test(x)&&!/^\\d{1,2}\\s*[:.]\\s*\\d{2}$/.test(x));return lines.join('\\n')}
  function itemNameScore(name,text){const nn=norm(name);if(!nn||!text)return 0;let best=0;const nameTokens=toks(name);const lines=[String(text),...String(text).split(/\\n+/)].map(x=>x.trim()).filter(Boolean);for(const line of lines){const nl=norm(line);if(!nl)continue;if(nl.includes(nn))best=Math.max(best,1);if(nn.includes(nl)&&nl.length>=3)best=Math.max(best,Math.min(.96,.56+(nl.length/Math.max(nn.length,1))*.38));const d=1-(levenshtein(nl,nn)/Math.max(nl.length,nn.length,1));best=Math.max(best,d);if(nameTokens.length){const lt=new Set(toks(line));const hits=nameTokens.filter(t=>lt.has(t)||nl.includes(norm(t))).length;if(hits)best=Math.max(best,Math.min(.97,.32+.64*(hits/nameTokens.length)))}}return Math.max(0,Math.min(1,best))}
  function rankItemNames(text){const names=[...new Set(db.map(r=>r['ชื่อวัตถุดิบ']).filter(Boolean))];return names.map(name=>({name,score:itemNameScore(name,text)})).filter(x=>x.score>.16).sort((a,b)=>b.score-a.score).slice(0,5)}
  function analyzeItemFirst(text){lastItemOCR=cleanItemRegionText(text);const ranked=rankItemNames(lastItemOCR);itemPriorityName=ranked[0]?.name||'';itemPriorityScore=ranked[0]?.score||0;if(itemPriorityName&&itemPriorityScore>=.34){$('itemText').value=itemPriorityName;populateState();$('keywordSummary').textContent=\`อ่านช่องรายการก่อน: “\${lastItemOCR.replace(/\\n+/g,' / ').slice(0,90)}” → น่าจะเป็น \${itemPriorityName} \${Math.round(itemPriorityScore*100)}% • กำลังอ่านส่วนอื่นเพื่อยืนยันเงื่อนไข...\`}else{$('keywordSummary').textContent=lastItemOCR?\`อ่านช่องรายการได้: “\${lastItemOCR.replace(/\\n+/g,' / ').slice(0,100)}” • ยังจับคู่ชื่อได้ไม่ชัด กำลังใช้ข้อความทั้งฉลากช่วยค้นหา...\`:'ยังอ่านชื่อในช่องรายการไม่ชัด กำลังอ่านข้อความทั้งฉลากเพื่อช่วยค้นหา...'}return ranked}
  function scoreRow(row,text){const nt=norm(text),ot=new Set(toks(text));let score=0,reasons=[];const name=row['ชื่อวัตถุดิบ'],nn=norm(name),priority=itemNameScore(name,lastItemOCR);if(priority>.12){score+=priority*230;reasons.push(\`ช่องรายการ:\${Math.round(priority*100)}%\`)}if(nn&&nt.includes(nn)){score+=90;reasons.push('ชื่อสินค้า')}
    for(const t of toks(name)){if(nt.includes(norm(t))||ot.has(t)){score+=Math.min(20,7+t.length*1.7);reasons.push(t)}}
    const fields=[['สถานะ',6],['อุณหภูมิ/สถานที่จัดเก็บ',5],['อุปกรณ์ที่จัดเก็บ',2.5],['ลักษณะตามมาตรฐาน',1.5],['หมายเหตุ',1.5]];for(const [f,w] of fields){let hit=0;for(const t of toks(row[f])){if(ot.has(t)||nt.includes(norm(t))){score+=w;hit++}}if(hit)reasons.push(\`\${f}:\${hit}\`)}
    const lines=String(text).split(/\\n+/).map(x=>x.trim()).filter(x=>x.length>=3&&x.length<110);let fuzzy=0;for(const ln of lines){const d=1-(levenshtein(ln,name)/Math.max(norm(ln).length,nn.length,1));if(d>fuzzy)fuzzy=d}if(fuzzy>.42){score+=fuzzy*30;reasons.push('ชื่อใกล้เคียง')}return {score,priority,reasons:[...new Set(reasons)].slice(0,8)}}
  function analyzeKeywords(text){if(!text||!db.length){lastCandidates=[];renderCandidates();return}const ranked=db.map((row,i)=>({row,index:i,...scoreRow(row,text)})).filter(x=>x.score>1).sort((a,b)=>b.score-a.score).slice(0,10);const max=ranked[0]?.score||1;ranked.forEach(x=>x.match=Math.max(1,Math.min(100,Math.round(x.score/max*100))));lastCandidates=ranked;const lead=itemPriorityName?\`ช่องรายการ → \${itemPriorityName} \${Math.round(itemPriorityScore*100)}% • \`:'';$('keywordSummary').textContent=ranked.length?\`\${lead}พบ \${ranked.length} เงื่อนไขที่น่าจะเป็น • ใช้ข้อความส่วนอื่นช่วยยืนยันสถานะและการจัดเก็บ\`:'ยังไม่พบ Key Word ที่สัมพันธ์กับฐานข้อมูล';renderCandidates();const gap=ranked.length>1?ranked[0].score-ranked[1].score:ranked[0]?.score||0;if(ranked[0]&&itemPriorityScore>=.55&&gap>=8)applyCandidate(0,false);else if(itemPriorityName&&itemPriorityScore>=.34){$('itemText').value=itemPriorityName;populateState()}}
`;
  h=h.replace(/  function scoreRow\(row,text\)\{[\s\S]*?  function parseInputDate/,scoreBlock+'  function parseInputDate');
  rep("currentImage=null;selectedRow=null;lastOCR='';lastCandidates=[];lastResult=null;","currentImage=null;selectedRow=null;lastOCR='';lastItemOCR='';itemPriorityName='';itemPriorityScore=0;lastCandidates=[];lastResult=null;");
  h=h.replace("  function mergeOCRText(a,b){","  function prepareItemRegion(canvas){const x=Math.max(0,Math.round(canvas.width*.06)),y=Math.max(0,Math.round(canvas.height*.48)),w=Math.min(canvas.width-x,Math.round(canvas.width*.76)),hh=Math.min(canvas.height-y,Math.round(canvas.height*.25)),c=document.createElement('canvas');c.width=Math.max(1,w);c.height=Math.max(1,hh);const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(canvas,x,y,w,hh,0,0,w,hh);const im=ctx.getImageData(0,0,c.width,c.height),d=im.data;for(let i=0;i<d.length;i+=4){const v=d[i],b=v<205?Math.max(0,v-20):Math.min(255,v+18);d[i]=d[i+1]=d[i+2]=b}ctx.putImageData(im,0,0);return c}\n  function mergeOCRText(a,b){");

  const run=`  async function runOCR(){if(!currentImage){alert('กรุณาถ่ายรูปหรือเลือกรูปก่อน');return}if(ocrBusy)return;ocrBusy=true;$('ocrArea').classList.remove('hidden');$('rawDetails').classList.add('hidden');$('ocrBtn').disabled=true;$('mobileAnalyze').disabled=true;$('progbar').style.width='3%';try{const worker=await initOCRWorker();const canvas=await prepareImage(currentImage),itemCanvas=prepareItemRegion(canvas);$('ocrStatus').textContent='ขั้นตอน 1/2 • กำลังอ่านตรงช่อง “รายการ” ก่อน...';await worker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1',user_defined_dpi:'300'});const itemOut=await worker.recognize(itemCanvas);analyzeItemFirst(itemOut.data.text||'');$('progbar').style.width='32%';$('ocrStatus').textContent=itemPriorityName?\`พบรายการใกล้เคียง “\${itemPriorityName}” • กำลังอ่านวันที่ เวลา และรายละเอียดส่วนอื่น...\`:'กำลังอ่านข้อความส่วนอื่นของฉลากเพื่อช่วยค้นหารายการ...';await worker.setParameters({tessedit_pageseg_mode:'11',preserve_interword_spaces:'1',user_defined_dpi:'300'});let out1=await worker.recognize(canvas,{},{imageColor:false,imageGrey:true,imageBinary:false});let text=out1.data.text||'',conf=Number(out1.data.confidence||0),usedSecond=false;if(needSecondPass(text,conf)){$('ocrStatus').textContent='กำลังเก็บข้อความเพิ่มเติมเพื่อให้วันที่/เวลาครบ...';$('progbar').style.width='78%';await worker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1',user_defined_dpi:'300'});const out2=await worker.recognize(canvas);text=mergeOCRText(text,out2.data.text||'');conf=Math.max(conf,Number(out2.data.confidence||0));usedSecond=true}await worker.setParameters({tessedit_pageseg_mode:'11',preserve_interword_spaces:'1',user_defined_dpi:'300'});lastOCR=mergeOCRText(lastItemOCR,text);$('rawText').textContent=\`[ช่องรายการ — อ่านก่อน]\\n\${lastItemOCR||'อ่านไม่ชัด'}\\n\\n[ข้อความทั้งฉลาก]\\n\${text}\`;$('rawDetails').classList.remove('hidden');extractFields(text);analyzeKeywords(lastOCR);$('progbar').style.width='100%';$('ocrStatus').textContent=\`อ่านเสร็จ • เน้นช่องรายการก่อน\${itemPriorityName?' → '+itemPriorityName:''} • ไทย + English • ความมั่นใจทั้งภาพ \${Math.round(conf)}%\${usedSecond?' • เก็บข้อความเพิ่ม':''}\`;setEngineState('OCR ไทย + English พร้อมใช้งาน','ready')}catch(err){$('ocrStatus').textContent='OCR ไม่สำเร็จ: '+err.message;setEngineState('OCR เกิดข้อผิดพลาด ลองใหม่ได้','error')}finally{ocrBusy=false;$('ocrBtn').disabled=!currentImage;$('mobileAnalyze').disabled=false}}
  $('ocrBtn').addEventListener('click',runOCR);$('mobileAnalyze').addEventListener('click',runOCR);`;
  h=h.replace(/  async function runOCR\(\)\{[\s\S]*?  \$\('ocrBtn'\)\.addEventListener\('click',runOCR\);\$\('mobileAnalyze'\)\.addEventListener\('click',runOCR\);/,run);
  h=h.replace("lastOCR='วันที่ผลิต 28/08/2569 เวลา 01:16 วันหมดอายุ 12/10/2569 เวลา 01:16 แยมสตรอเบอร์รี่ Ichigo จำนวน 1 อุณหภูมิเย็น บรรจุภัณฑ์ที่ยังไม่เปิดใช้งาน / Production Date 28/08/2569 Expiry Date 12/10/2569';$('rawText').textContent=lastOCR;$('rawDetails').classList.remove('hidden');analyzeKeywords(lastOCR);","lastItemOCR='แยมสตรอเบอร์รี่ Ichigo';analyzeItemFirst(lastItemOCR);lastOCR='วันที่ผลิต 28/08/2569 เวลา 01:16 วันหมดอายุ 12/10/2569 เวลา 01:16 แยมสตรอเบอร์รี่ Ichigo จำนวน 1 อุณหภูมิเย็น บรรจุภัณฑ์ที่ยังไม่เปิดใช้งาน / Production Date 28/08/2569 Expiry Date 12/10/2569';$('rawText').textContent='[ช่องรายการ — อ่านก่อน]\\n'+lastItemOCR+'\\n\\n[ข้อความทั้งฉลาก]\\n'+lastOCR;$('rawDetails').classList.remove('hidden');analyzeKeywords(lastOCR);");
  document.open();document.write(h);document.close();
})().catch(e=>{document.body.innerHTML='<div class="load"><b>โหลดระบบไม่สำเร็จ</b><div style="margin-top:8px;color:#b42318">'+String(e.message||e)+'</div><div style="margin-top:12px">กรุณารีเฟรชหน้าเว็บอีกครั้ง</div></div>'});
</script></body></html>
