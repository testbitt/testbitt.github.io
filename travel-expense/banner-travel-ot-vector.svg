<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 686" role="img" aria-labelledby="title desc">
<title id="title">ระบบบันทึกค่าเดินทาง และ OT</title>
<desc id="desc">แบนเนอร์อนิเมะสำหรับระบบพนักงาน KAMU บันทึกค่าเดินทางและโอที</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefbe9"/><stop offset=".45" stop-color="#fffdf7"/><stop offset="1" stop-color="#fff0bf"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#164b2c"/><stop offset="1" stop-color="#6e9f32"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9d15"/><stop offset="1" stop-color="#ffc448"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe3cc"/><stop offset="1" stop-color="#f7b98d"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4b2f20"/><stop offset="1" stop-color="#1f1712"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#244c2b" flood-opacity=".22"/></filter>
