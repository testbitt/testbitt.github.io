let layoutGroupOrder=[];
function sortEntriesByLayoutOrder(entries){const pos=new Map(layoutGroupOrder.map((k,i)=>[String(k),i]));return [...entries].sort((a,b)=>{const ai=pos.has(String(a[0]))?pos.get(String(a[0])):999999,bi=pos.has(String(b[0]))?pos.get(String(b[0])):999999;return ai-bi})}

}
function chunk(arr,size){const out=[];for(let i=0;i<arr.length;i+=size)out.push(arr.slice(i,i+size));return out}
function applyDisplayPrefs(){
  const color=COLORS[(displayPrefs.color_index||1)-1]||COLORS[0];
  document.documentElement.style.setProperty("--red",color);
  const idx=Math.max(1,Math.min(50,Number(displayPrefs.theme_index)||1));
  document.body.classList.remove(...THEME_CLASSES);
  document.body.classList.add(THEME_CLASSES[idx-1]);
  const radiusChoices=[0,4,8,12,16,20,24];
  const shadowChoices=["none","0 2px 8px rgba(0,0,0,.05)","0 5px 16px rgba(0,0,0,.08)","0 8px 24px rgba(0,0,0,.11)"];
  const gapChoices=[8,10,12,14,16,18];

  document.documentElement.style.setProperty("--theme-shadow",shadowChoices[Math.floor((idx-1)/7)%shadowChoices.length]);

}
async function saveExportPrefs(){
  const ds=document.getElementById("dataset").value;
  displayPrefs={
    orientation:document.getElementById("orientation").value,
    items_per_page:Math.max(1,Math.min(20,Number(document.getElementById("itemsPerPage").value)||1)),
    theme_index:Math.max(1,Math.min(50,Number(document.getElementById("themeSelect").value)||1)),
    color_index:Number(document.getElementById("colorSelect").value)||1
  };
  applyDisplayPrefs();
  const msg=document.getElementById("msg");
  msg.textContent="กำลัง Auto Save Layout สำหรับ Export...";
  try{
    await api({action:"save",dataset:"settings",row:{key:"display_preferences_"+ds,value:displayPrefs}});
    await load();
    await fitAllExportPages();
    msg.textContent="บันทึก Layout สำหรับ Export แล้ว • ใช้เฉพาะหัวข้อนี้";
  }catch(e){msg.textContent=e.message}
}
async function loadDisplayPrefs(ds=document.getElementById("dataset").value){
  displayPrefs={...DEFAULT_DISPLAY_PREFS};layoutGroupOrder=[];
  const res=await api({action:"list",dataset:"settings"});
  const data=res.data||[];
  const own=data.find(x=>x.key==="display_preferences_"+ds);
  const legacy=data.find(x=>x.key==="display_preferences");
  const row=own||legacy;
  if(row?.value) displayPrefs={...displayPrefs,...row.value};
  displayPrefs.theme_index=Math.max(1,Math.min(50,Number(displayPrefs.theme_index)||1));
  const orderRow=data.find(x=>x.key==="layout_group_order_"+ds);
  if(Array.isArray(orderRow?.value)) layoutGroupOrder=orderRow.value.map(String);
  applyDisplayPrefs();
}
function esc(v=""){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
async function api(payload){const r=await fetch(ADMIN_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...payload,pin})});const d=await r.json().catch(()=>({error:"Invalid response"}));if(!r.ok)throw new Error(d.error||"เกิดข้อผิดพลาด");return d}
function groupBy(rows,keyFn){const g={};for(const r of rows){const k=keyFn(r);(g[k]??=[]).push(r)}return g}
async function load(){
  if(!pin){location.href="admin.html";return}
  const ds=document.getElementById("dataset").value,msg=document.getElementById("msg");
  try{await loadDisplayPrefs(ds)}catch(e){console.warn("โหลด Layout ไม่สำเร็จ",e)}
  document.getElementById("pages").innerHTML='<div class="page-wrap"><section class="page '+document.getElementById("orientation").value+'"><div class="state">กำลังโหลดข้อมูล...</div></section></div>';fitPreviewPages();
  try{
    let rows;
    if(ds==="drinks"){
      const [a,b]=await Promise.all([api({action:"list",dataset:"drinks"}),api({action:"list",dataset:"drink_meta"})]);
      rows=a.data||[];drinkMeta=Object.fromEntries((b.data||[]).map(x=>[x.recipe_id,x]));
    }else rows=(await api({action:"list",dataset:ds})).data||[];
    await render(ds,rows);
    await fitAllExportPages();
    msg.textContent="พร้อม Export • "+rows.length+" รายการ • "+document.querySelectorAll("#pages .page").length+" หน้า A4";
  }catch(e){
    document.getElementById("pages").innerHTML='<div class="page-wrap"><section class="page '+document.getElementById("orientation").value+'"><div class="state">'+esc(e.message)+'</div></section></div>';fitPreviewPages();
    msg.textContent=e.message;
  }
}
function makePage(title){
  const ori=displayPrefs.orientation,p=document.createElement("section"),wrap=document.createElement("div");
  p.className="page "+ori;
  wrap.className="page-wrap";
  p.innerHTML='<div class="page-title">'+esc(title)+'</div><div class="page-content"></div>';
  wrap.appendChild(p);document.getElementById("pages").appendChild(wrap);
  requestAnimationFrame(fitPreviewPages);
  return p;
}
function fitPreviewPages(){
  const shell=document.querySelector(".preview-shell");if(!shell)return;
  const avail=Math.max(280,shell.clientWidth-16);
  document.querySelectorAll(".page-wrap").forEach(w=>{
    const p=w.querySelector(".page");if(!p)return;
    p.style.transform="none";w.style.width="auto";w.style.height="auto";
    const naturalW=p.offsetWidth,naturalH=p.offsetHeight;
    const scale=Math.min(1,avail/naturalW);
    p.style.transform="scale("+scale+")";
    w.style.width=(naturalW*scale)+"px";
    w.style.height=(naturalH*scale)+"px";
  });
}
function makeGridPage(title){
  const p=makePage(title),g=document.createElement("div");g.className="grid";p.querySelector(".page-content").appendChild(g);return {page:p,grid:g};
}
function pageOverflow(page){
  const content=page.querySelector(".page-content");
  if(!content)return false;
  const pr=page.getBoundingClientRect(),cr=content.getBoundingClientRect();
  if(cr.right>pr.right+1||cr.bottom>pr.bottom+1)return true;
  return [...content.querySelectorAll(".fit-cell:not(.fit-cell-empty)")].some(cell=>{
    const sheet=cell.querySelector(":scope > .sheet");
    if(!sheet)return false;
    const c=cell.getBoundingClientRect(),s=sheet.getBoundingClientRect();
    return s.right>c.right+1||s.bottom>c.bottom+1||s.left<c.left-1||s.top<c.top-1;
  });
}
async function waitForSheetImages(sheet){
  const imgs=[...sheet.querySelectorAll("img")];
  await Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=img.onerror=r})));
}
function setPageDensity(page){
  page.classList.remove("density-medium","density-high","fit-tight","fit-ultra");
}
function exportGridShape(count,orientation){
  count=Math.max(1,Math.min(Number(count)||1,20));
  const landscape=orientation==="landscape";
  let cols;
  if(count===1) cols=1;
  else if(count<=4) cols=2;
  else if(count<=6) cols=landscape?3:2;
  else if(count<=9) cols=3;
  else if(count<=12) cols=landscape?4:3;
  else if(count<=16) cols=4;
  else cols=landscape?5:4;
  return {cols,rows:Math.ceil(count/cols)};
}
function resetExportSheet(sheet){
  sheet.style.transform="none";
  sheet.style.transformOrigin="top left";
  sheet.style.width="100%";
  sheet.style.height="auto";
  sheet.style.maxHeight="none";
  sheet.style.overflow="visible";
}
function measureNaturalBounds(sheet){
  const base=sheet.getBoundingClientRect();
  let maxRight=Math.max(sheet.scrollWidth,base.width,1);
  let maxBottom=Math.max(sheet.scrollHeight,base.height,1);
  sheet.querySelectorAll(".sheet-title,.sheet-body,.photo,.note,table,thead,tbody,tr,th,td,img").forEach(el=>{
    const r=el.getBoundingClientRect();
    maxRight=Math.max(maxRight,r.right-base.left,el.scrollWidth||0);
    maxBottom=Math.max(maxBottom,r.bottom-base.top,el.scrollHeight||0);
  });
  return {w:maxRight,h:maxBottom};
}
function fitExportSheetInCell(cell){
  const sheet=cell.querySelector(":scope > .sheet");if(!sheet)return true;
  const cr=cell.getBoundingClientRect();
  const cellW=Math.max(1,cr.width-2),cellH=Math.max(1,cr.height-2);

  sheet.style.position="absolute";
  sheet.style.top="0";
  sheet.style.left="0";
  sheet.style.maxWidth="none";
  sheet.style.maxHeight="none";
  sheet.style.height="auto";
  sheet.style.overflow="visible";
  sheet.style.transformOrigin="top left";

  // Fast fit: start from real cell width, measure once, then refine at most twice.
  let scale=1;
  sheet.style.transform="none";
  sheet.style.width=cellW+"px";
  let h=Math.max(sheet.scrollHeight,sheet.getBoundingClientRect().height,1);
  if(h>cellH) scale=Math.max(.04,cellH/h);

  for(let i=0;i<2;i++){
    sheet.style.transform="none";
    sheet.style.width=(cellW/scale)+"px";
    sheet.style.transform="scale("+scale+")";
    const r=sheet.getBoundingClientRect();
    const factor=Math.min(1,cellW/Math.max(1,r.width),cellH/Math.max(1,r.height));
    if(factor>=.995)break;
    scale=Math.max(.04,scale*factor*.99);
  }

  scale=Math.min(1,scale);
  sheet.style.transform="none";
  sheet.style.width=(cellW/scale)+"px";
  sheet.style.transform="scale("+scale+")";
  sheet.dataset.fitScale=scale.toFixed(4);

  const fr=sheet.getBoundingClientRect();
  const ok=fr.width<=cellW+1&&fr.height<=cellH+1;
  cell.dataset.fitOk=ok?"1":"0";
  return ok;
}
function fitExportPageContent(page){
  const content=page.querySelector(".page-content");
  const grid=content?.querySelector(".grid");
  if(!content||!grid)return true;

  setPageDensity(page);
  content.style.transform="none";
  content.style.overflow="hidden";

  const allCells=[...grid.children].filter(el=>el.classList?.contains("fit-cell"));
  const cells=allCells.filter(el=>!el.classList.contains("fit-cell-empty"));
  if(!allCells.length)return true;

  const selected=Math.max(1,Math.min(20,Number(displayPrefs.items_per_page)||1));
  const shape=exportGridShape(selected,displayPrefs.orientation);
  const gap=selected>=17?4:selected>=13?5:selected>=7?7:10;

  // Use the exact allocated flex height of page-content, not auto/scroll height.
  const contentH=Math.max(1,content.clientHeight);
  grid.style.transform="none";
  grid.style.width="100%";
  grid.style.height=contentH+"px";
  grid.style.minHeight=contentH+"px";
  grid.style.maxHeight=contentH+"px";
  grid.style.gap=gap+"px";
  grid.style.gridTemplateColumns="repeat("+shape.cols+",minmax(0,1fr))";
  grid.style.gridTemplateRows="repeat("+shape.rows+",minmax(0,1fr))";
  grid.style.gridAutoRows="minmax(0,1fr)";

  allCells.forEach(cell=>{
    cell.style.width="100%";
    cell.style.height="100%";
    cell.style.minWidth="0";
    cell.style.minHeight="0";
    cell.style.overflow="hidden";
  });

  page.dataset.gridCols=String(shape.cols);
  page.dataset.gridRows=String(shape.rows);

  let ok=true;
  cells.forEach(cell=>{if(!fitExportSheetInCell(cell))ok=false});
  page.dataset.fitOk=ok?"1":"0";
  return ok;
}
function validateExportLayout(){
  let ok=true;
  document.querySelectorAll("#pages .page").forEach(page=>{
    const pr=page.getBoundingClientRect();
    const content=page.querySelector(".page-content");
    if(!content){ok=false;return}
    const cr=content.getBoundingClientRect();
    if(cr.right>pr.right+1||cr.bottom>pr.bottom+1)ok=false;
    page.querySelectorAll(".fit-cell:not(.fit-cell-empty)").forEach(cell=>{
      const sheet=cell.querySelector(":scope > .sheet");
      if(!sheet){ok=false;return}
      const a=cell.getBoundingClientRect(),b=sheet.getBoundingClientRect();
      if(b.left<a.left-1||b.top<a.top-1||b.right>a.right+1||b.bottom>a.bottom+1)ok=false;
    });
  });
  return ok;
}
async function fitAllExportPages(){
  const pages=[...document.querySelectorAll("#pages .page")];

  await Promise.all(pages.flatMap(page=>[...page.querySelectorAll("img")].map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=img.onerror=r}))));
  if(document.fonts?.ready){try{await document.fonts.ready}catch{}}

  // Reset preview transform before measuring the physical A4 layout.
  document.querySelectorAll(".page-wrap").forEach(w=>{
    const p=w.querySelector(".page");
    if(p){p.style.transform="none";w.style.width="auto";w.style.height="auto"}
  });

  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

  for(let pass=0;pass<2;pass++){
    pages.forEach(fitExportPageContent);
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  }

  // One final conservative correction only for cells that still exceed a boundary.
  pages.forEach(page=>{
    page.querySelectorAll(".fit-cell:not(.fit-cell-empty)").forEach(cell=>{
      if(cell.dataset.fitOk!=="1")fitExportSheetInCell(cell);
    });
  });

  const valid=validateExportLayout();
  pages.forEach(page=>page.dataset.layoutValid=valid?"1":"0");
  fitPreviewPages();
  return valid;
}

async function packSheets(title,sheets){
  const pagesRoot=document.getElementById("pages");
  pagesRoot.innerHTML="";
  const perPage=visualItemsPerPage();
  const groups=chunk(sheets,perPage);
  const made=[];

  for(let pi=0;pi<groups.length;pi++){
    const obj=makeGridPage(title+" • หน้า "+(pi+1)+" / "+groups.length);
    made.push(obj);
    setPageDensity(obj.page);
    for(const sheet of groups[pi]){
      const cell=document.createElement("div");
      cell.className="fit-cell";
      cell.appendChild(sheet);
      obj.grid.appendChild(cell);
      await waitForSheetImages(sheet);
    }
    // Preserve exactly the selected layout on every page. Incomplete final pages keep blank cells.
    for(let bi=groups[pi].length;bi<perPage;bi++){
      const blank=document.createElement("div");
      blank.className="fit-cell fit-cell-empty";
      blank.setAttribute("aria-hidden","true");
      obj.grid.appendChild(blank);
    }
    await new Promise(r=>requestAnimationFrame(r));
    fitExportPageContent(obj.page);
  }
  await fitAllExportPages();
}

async function render(ds,rows){
  let entries,title,builder;
  if(ds==="drinks"){const g=groupBy(rows,r=>r.recipe_id||"NO-ID");entries=sortEntriesByLayoutOrder(Object.entries(g));title="สูตรชงเครื่องดื่ม";builder=([id,items])=>drinkSheet(id,items)}
  else if(ds==="production"){const g=groupBy(rows,r=>r.recipe_name||"ไม่ระบุชื่อ");entries=sortEntriesByLayoutOrder(Object.entries(g));title="สูตรการผลิต";builder=([name,items])=>productionSheet(name,[...items].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)))}
  else if(ds==="expiry"){const g=groupBy(rows,r=>r.category||"วันหมดอายุ");entries=sortEntriesByLayoutOrder(Object.entries(g));title="วันหมดอายุ";builder=([name,items])=>expirySheet(name,items)}
  else if(ds==="toppings"){const g=groupBy(rows,r=>(r.category||"Topping")+" • "+(r.subcategory||"ทั่วไป"));entries=sortEntriesByLayoutOrder(Object.entries(g));title="Topping";builder=([name,items])=>toppingSheet(name,[...items].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)))}
  else if(ds==="uniforms"){const g=groupBy(rows,r=>r.category||"เครื่องแต่งกาย");entries=sortEntriesByLayoutOrder(Object.entries(g));title="เครื่องแต่งกาย";builder=([name,items])=>uniformSheet(name,[...items].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)))}
  else if(ds==="courses"){entries=sortEntriesByLayoutOrder(rows.slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(r=>[String(r.id),r]));title="บทเรียนอื่น ๆ";builder=([,row])=>courseSheet(row)}
  else {entries=[];title="Export";builder=()=>document.createElement("div")}
  const sheets=entries.map(builder);
  await packSheets(title,sheets);
  const imgs=[...document.querySelectorAll("#pages img")];
  await Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=img.onerror=r})));
  await new Promise(r=>requestAnimationFrame(r));
  const bad=[...document.querySelectorAll("#pages .page")].filter(pageOverflow);
  if(bad.length) console.warn("A4 overflow detected",bad.length);
}

async function ensureExportFitBeforeCapture(){
  const ok=await fitAllExportPages();
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  if(!ok||!validateExportLayout()) throw new Error("Layout A4 ยังไม่พอดี กรุณาเปลี่ยนจำนวนรายการต่อหน้าแล้วลองใหม่");
}
let exportBusy=false;
function setExportBusy(on,label=""){
  exportBusy=on;
  document.getElementById("pngBtn").disabled=on;
  document.getElementById("pdfBtn").disabled=on;
  if(on&&label)document.getElementById("msg").textContent=label;
}
function nextFrame(){return new Promise(r=>requestAnimationFrame(()=>r()))}
async function pageCanvas(el,qualityMode="pdf"){
  if(document.fonts?.ready)await document.fonts.ready;
  const old=el.style.transform;
  el.style.transform="none";
  await nextFrame();

  const pixels=el.offsetWidth*el.offsetHeight;
  let scale=qualityMode==="png"?2.2:1.85;
  if(pixels>1200000)scale=Math.min(scale,1.7);
  if(window.innerWidth<700)scale=Math.min(scale,1.5);

  const canvas=await html2canvas(el,{
    scale,
    useCORS:true,
    allowTaint:false,
    backgroundColor:"#ffffff",
    logging:false,
    removeContainer:true,
    imageTimeout:8000,
    width:el.offsetWidth,
    height:el.offsetHeight,
    windowWidth:el.offsetWidth,
    windowHeight:el.offsetHeight
  });
  el.style.transform=old;
  return canvas;
}
document.getElementById("pngBtn").onclick=async()=>{
  if(exportBusy)return;
  const msg=document.getElementById("msg");
  try{
    setExportBusy(true,"กำลังตรวจ Layout...");
    await ensureExportFitBeforeCapture();
    const pages=[...document.querySelectorAll("#pages .page")],ds=document.getElementById("dataset").value;
    for(let i=0;i<pages.length;i++){
      msg.textContent="กำลัง Export PNG หน้า "+(i+1)+" / "+pages.length;
      const canvas=await pageCanvas(pages[i],"png");
      const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error("สร้าง PNG ไม่สำเร็จ")),"image/png"));
      const url=URL.createObjectURL(blob),a=document.createElement("a");
      a.href=url;a.download="Yothe_"+ds+"_A4_page_"+String(i+1).padStart(2,"0")+".png";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1500);
      canvas.width=1;canvas.height=1;
      await new Promise(r=>setTimeout(r,80));
    }
    msg.textContent="Export PNG สำเร็จ "+pages.length+" หน้า A4";
  }catch(e){msg.textContent="Export PNG ไม่สำเร็จ: "+e.message}
  finally{setExportBusy(false)}
};
document.getElementById("pdfBtn").onclick=async()=>{
  if(exportBusy)return;
  const msg=document.getElementById("msg");
  try{
    setExportBusy(true,"กำลังตรวจ Layout...");
    await ensureExportFitBeforeCapture();
    const pages=[...document.querySelectorAll("#pages .page")],ds=document.getElementById("dataset").value;
    const ori=displayPrefs.orientation==="landscape"?"landscape":"portrait";
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:ori,unit:"mm",format:"a4",compress:true});
    const pw=ori==="landscape"?297:210,ph=ori==="landscape"?210:297;
    for(let i=0;i<pages.length;i++){
      msg.textContent="กำลังสร้าง PDF หน้า "+(i+1)+" / "+pages.length;
      const canvas=await pageCanvas(pages[i],"pdf");
      const img=canvas.toDataURL("image/jpeg",0.92);
      if(i>0)pdf.addPage("a4",ori);
      pdf.addImage(img,"JPEG",0,0,pw,ph,undefined,"FAST");
      canvas.width=1;canvas.height=1;
      await new Promise(r=>setTimeout(r,80));
    }
    pdf.save("Yothe_"+ds+"_A4_"+ori+".pdf");
    msg.textContent="Export PDF สำเร็จ "+pages.length+" หน้า A4";
  }catch(e){msg.textContent="Export PDF ไม่สำเร็จ: "+e.message}
  finally{setExportBusy(false)}
};

["orientation","itemsPerPage","themeSelect","colorSelect"].forEach(id=>document.getElementById(id).addEventListener("change",saveExportPrefs));
