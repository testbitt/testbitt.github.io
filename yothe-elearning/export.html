function fitPreviewPages(){
  const shell=document.querySelector(".preview-shell");if(!shell)return;
  const avail=Math.max(280,shell.clientWidth-16);
  document.querySelectorAll(".page-wrap").forEach(w=>{
    const p=w.querySelector(".page");if(!p)return;
    p.style.transform="none";w.style.width="auto";w.style.height="auto";
    const naturalW=p.offsetWidth,naturalH=p.offsetHeight;
    const scale=Math.min(1,avail/naturalW);
    p.style.transform="scale("+scale+")";
    w.style.width=(naturalW*scale)+"px";
    w.style.height=(naturalH*scale)+"px";
  });
}
function makeGridPage(title){
  const p=makePage(title),g=document.createElement("div");g.className="grid";p.querySelector(".page-content").appendChild(g);return {page:p,grid:g};

function pageOverflow(page){
  const content=page.querySelector(".page-content");
  if(!content)return false;
  const pr=page.getBoundingClientRect(),cr=content.getBoundingClientRect();
  if(cr.right>pr.right+1||cr.bottom>pr.bottom+1)return true;
  return [...content.querySelectorAll(".sheet")].some(sheet=>{
    const r=sheet.getBoundingClientRect();
    return r.right>cr.right+1||r.bottom>cr.bottom+1||r.left<cr.left-1||r.top<cr.top-1;
  });
}

function setPageDensity(page){
  page.classList.remove("density-medium","density-high","fit-tight","fit-ultra");
  const n=Math.max(1,Number(displayPrefs.items_per_page)||1);
  if(n>=13) page.classList.add("density-high");
  else if(n>=7) page.classList.add("density-medium");
}
function exportGridShape(count,orientation){
  count=Math.max(1,Math.min(Number(count)||1,20));
  const landscape=orientation==="landscape";
  let cols;
  if(count===1) cols=1;
  else if(count<=4) cols=2;
  else if(count<=6) cols=landscape?3:2;
  else if(count<=9) cols=3;
  else if(count<=12) cols=landscape?4:3;
  else if(count<=16) cols=4;
  else cols=landscape?5:4;
  return {cols,rows:Math.ceil(count/cols)};
}
function resetExportSheet(sheet){
  sheet.style.transform="none";
  sheet.style.transformOrigin="top left";
  sheet.style.width="100%";
  sheet.style.height="auto";
  sheet.style.maxHeight="none";
  sheet.style.overflow="visible";
}
function measureNaturalBounds(sheet){
  const base=sheet.getBoundingClientRect();
  let maxRight=Math.max(sheet.scrollWidth,base.width,1);
  let maxBottom=Math.max(sheet.scrollHeight,base.height,1);
  sheet.querySelectorAll(".sheet-title,.sheet-body,.photo,.note,table,thead,tbody,tr,th,td,img").forEach(el=>{
    const r=el.getBoundingClientRect();
    maxRight=Math.max(maxRight,r.right-base.left,el.scrollWidth||0);
    maxBottom=Math.max(maxBottom,r.bottom-base.top,el.scrollHeight||0);
  });
  return {w:maxRight,h:maxBottom};
}
function fitExportSheet(sheet,cellW,cellH){
  resetExportSheet(sheet);
  const natural=measureNaturalBounds(sheet);
  let scale=Math.min(1,(cellW-2)/Math.max(1,natural.w),(cellH-2)/Math.max(1,natural.h));
  if(!Number.isFinite(scale)||scale<=0)scale=1;
  // No practical minimum: selected layout count must always fit and preserve all rows.
  scale=Math.max(.025,scale*.975);
  sheet.style.transform="scale("+scale+")";
  sheet.style.width=(100/scale)+"%";
  sheet.dataset.fitScale=scale.toFixed(5);
  sheet.dataset.naturalWidth=String(natural.w);
  sheet.dataset.naturalHeight=String(natural.h);
}
function fitExportPageContent(page){
  const content=page.querySelector(".page-content");
  const grid=content?.querySelector(".grid");
  if(!content||!grid)return;

  setPageDensity(page);
  content.style.transform="none";
  content.style.height="auto";
  content.style.overflow="hidden";
  grid.style.transform="none";
  grid.style.width="100%";
  grid.style.height="100%";

  const sheets=[...grid.children].filter(el=>el.classList?.contains("sheet"));
  if(!sheets.length)return;
  sheets.forEach(resetExportSheet);

  const shape=exportGridShape(sheets.length,displayPrefs.orientation);
  const selected=Math.max(1,Number(displayPrefs.items_per_page)||1);
  const gap=selected>=17?4:selected>=13?5:selected>=7?7:10;
  grid.style.gap=gap+"px";
  grid.style.gridTemplateColumns="repeat("+shape.cols+",minmax(0,1fr))";
  grid.style.gridTemplateRows="repeat("+shape.rows+",minmax(0,1fr))";
  grid.style.gridAutoRows="minmax(0,1fr)";

  const gr=grid.getBoundingClientRect();
  const cellW=Math.max(1,(gr.width-gap*(shape.cols-1))/shape.cols);
  const cellH=Math.max(1,(gr.height-gap*(shape.rows-1))/shape.rows);
  sheets.forEach(sheet=>fitExportSheet(sheet,cellW,cellH));

  page.dataset.gridCols=String(shape.cols);
  page.dataset.gridRows=String(shape.rows);
}
async function fitAllExportPages(){
  const pages=[...document.querySelectorAll("#pages .page")];
  await Promise.all(pages.flatMap(page=>[...page.querySelectorAll("img")].map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=img.onerror=r}))));
  if(document.fonts?.ready){try{await document.fonts.ready}catch{}}
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

  // Multiple passes handle text re-wrap after width changes.
  for(let pass=0;pass<3;pass++){
    pages.forEach(fitExportPageContent);
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  }

  // Final safety pass: shrink only offending sheet until its complete bounds fit inside its grid cell.
  for(const page of pages){
    const grid=page.querySelector(".grid");if(!grid)continue;
    const sheets=[...grid.children].filter(el=>el.classList?.contains("sheet"));
    for(const sheet of sheets){
      for(let pass=0;pass<8;pass++){
        const sr=sheet.getBoundingClientRect();
        const style=getComputedStyle(grid);
        const colGap=parseFloat(style.columnGap)||0,rowGap=parseFloat(style.rowGap)||0;
        const shape=exportGridShape(sheets.length,displayPrefs.orientation);
        const gr=grid.getBoundingClientRect();
        const cellW=(gr.width-colGap*(shape.cols-1))/shape.cols;
        const cellH=(gr.height-rowGap*(shape.rows-1))/shape.rows;
        if(sr.width<=cellW+0.5&&sr.height<=cellH+0.5)break;
        const current=Number(sheet.dataset.fitScale||1);
        let factor=Math.min(cellW/Math.max(1,sr.width),cellH/Math.max(1,sr.height),.97);
        if(!Number.isFinite(factor)||factor<=0||factor>=1)factor=.94;
        const next=Math.max(.025,current*factor);
        sheet.style.transform="scale("+next+")";
        sheet.style.width=(100/next)+"%";
        sheet.dataset.fitScale=next.toFixed(5);
        await new Promise(r=>requestAnimationFrame(r));
      }
    }
  }
  fitPreviewPages();
}

async function packSheets(title,sheets){
  const pagesRoot=document.getElementById("pages");
  pagesRoot.innerHTML="";
  const perPage=visualItemsPerPage();
  const groups=chunk(sheets,perPage);
  const made=[];

  for(let pi=0;pi<groups.length;pi++){
    const obj=makeGridPage(title+" • หน้า "+(pi+1)+" / "+groups.length);
    made.push(obj);
    setPageDensity(obj.page);
    for(const sheet of groups[pi]){
      obj.grid.appendChild(sheet);
      await waitForSheetImages(sheet);
    }
    await new Promise(r=>requestAnimationFrame(r));
    fitExportPageContent(obj.page);
  }
  await fitAllExportPages();
}

  let entries,title,builder;
  if(ds==="drinks"){const g=groupBy(rows,r=>r.recipe_id||"NO-ID");entries=sortEntriesByLayoutOrder(Object.entries(g));title="สูตรชงเครื่องดื่ม";builder=([id,items])=>drinkSheet(id,items)}
  else if(ds==="production"){const g=groupBy(rows,r=>r.recipe_name||"ไม่ระบุชื่อ");entries=sortEntriesByLayoutOrder(Object.entries(g));title="สูตรการผลิต";builder=([name,items])=>productionSheet(name,[...items].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)))}
  else if(ds==="expiry"){const g=groupBy(rows,r=>r.category||"วันหมดอายุ");entries=sortEntriesByLayoutOrder(Object.entries(g));title="วันหมดอายุ";builder=([name,items])=>expirySheet(name,items)}
  else if(ds==="toppings"){const g=groupBy(rows,r=>(r.category||"Topping")+" • "+(r.subcategory||"ทั่วไป"));entries=sortEntriesByLayoutOrder(Object.entries(g));title="Topping";builder=([name,items])=>toppingSheet(name,[...items].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)))}
  else if(ds==="uniforms"){const g=groupBy(rows,r=>r.category||"เครื่องแต่งกาย");entries=sortEntriesByLayoutOrder(Object.entries(g));title="เครื่องแต่งกาย";builder=([name,items])=>uniformSheet(name,[...items].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)))}
  else if(ds==="courses"){entries=sortEntriesByLayoutOrder(rows.slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(r=>[String(r.id),r]));title="บทเรียนอื่น ๆ";builder=([,row])=>courseSheet(row)}
  else {entries=[];title="Export";builder=()=>document.createElement("div")}
  const sheets=entries.map(builder);
  await packSheets(title,sheets);
  const imgs=[...document.querySelectorAll("#pages img")];
  await Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=img.onerror=r})));
  await new Promise(r=>requestAnimationFrame(r));
  const bad=[...document.querySelectorAll("#pages .page")].filter(pageOverflow);
  if(bad.length) console.warn("A4 overflow detected",bad.length);
}

async function ensureExportFitBeforeCapture(){
  await fitAllExportPages();
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
}
async function pageCanvas(el){
  if(document.fonts?.ready)await document.fonts.ready;
  const old=el.style.transform;el.style.transform="none";
  await new Promise(r=>requestAnimationFrame(r));
  const selected=getComputedStyle(document.documentElement).getPropertyValue("--red").trim()||"#d71920";
  const canvas=await html2canvas(el,{
    scale:3,useCORS:true,allowTaint:false,backgroundColor:"#ffffff",logging:false,
    width:el.offsetWidth,height:el.offsetHeight,windowWidth:el.offsetWidth,windowHeight:el.offsetHeight,
    onclone:(doc)=>{
      const root=doc.documentElement;
      root.style.setProperty("--red",selected);
      doc.querySelectorAll(".page-title,.sheet-title,th").forEach(x=>{
        x.style.backgroundColor=selected;
        x.style.color="#ffffff";
      });
      doc.querySelectorAll(".note").forEach(x=>{x.style.backgroundColor="#ffef57";x.style.color="#d91d0b"});
    }
  });
  el.style.transform=old;fitPreviewPages();
  return canvas;
}
document.getElementById("pngBtn").onclick=async()=>{
  const msg=document.getElementById("msg");
  try{
    await ensureExportFitBeforeCapture();
    const pages=[...document.querySelectorAll("#pages .page")],ds=document.getElementById("dataset").value;
    msg.textContent="กำลัง Export PNG "+pages.length+" หน้า...";
    for(let i=0;i<pages.length;i++){
      const canvas=await pageCanvas(pages[i]),a=document.createElement("a");
      a.href=canvas.toDataURL("image/png",1);
      a.download="Yothe_"+ds+"_A4_page_"+String(i+1).padStart(2,"0")+".png";
      document.body.appendChild(a);a.click();a.remove();
      await new Promise(r=>setTimeout(r,250));
    }
    msg.textContent="Export PNG สำเร็จ "+pages.length+" หน้า A4";
  }catch(e){msg.textContent="Export PNG ไม่สำเร็จ: "+e.message}
};
document.getElementById("pdfBtn").onclick=async()=>{
  const msg=document.getElementById("msg");
  try{
    await ensureExportFitBeforeCapture();
    const pages=[...document.querySelectorAll("#pages .page")],ds=document.getElementById("dataset").value,ori=displayPrefs.orientation==="landscape"?"landscape":"portrait",{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:ori,unit:"mm",format:"a4"}),pw=ori==="landscape"?297:210,ph=ori==="landscape"?210:297;
    msg.textContent="กำลัง Export PDF "+pages.length+" หน้า...";
    for(let i=0;i<pages.length;i++){
      const canvas=await pageCanvas(pages[i]),img=canvas.toDataURL("image/png",1);
      if(i>0)pdf.addPage("a4",ori);
      pdf.addImage(img,"PNG",0,0,pw,ph,undefined,"FAST");
    }
    pdf.save("Yothe_"+ds+"_A4_"+ori+".pdf");
    msg.textContent="Export PDF สำเร็จ "+pages.length+" หน้า A4";
  }catch(e){msg.textContent="Export PDF ไม่สำเร็จ: "+e.message}
};
initExportControls();
document.getElementById("dataset").onchange=load;
["orientation","itemsPerPage","themeSelect","colorSelect"].forEach(id=>document.getElementById(id).addEventListener("change",saveExportPrefs));
let exportResizeTimer=null;window.addEventListener("resize",()=>{clearTimeout(exportResizeTimer);exportResizeTimer=setTimeout(()=>fitAllExportPages(),140)});
load();
</script>
