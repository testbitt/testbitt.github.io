<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yothé Export</title>
<style>
:root{--red:#d71920;--ink:#171717;--muted:#6b7280;--line:#e5e7eb;--bg:#f4f5f7}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Thai","Leelawadee UI",Tahoma,Arial,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,select,input{font:inherit}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.topin{max-width:1240px;margin:auto;min-height:70px;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:22px;font-weight:900;color:var(--red);display:flex;align-items:center;gap:10px}.brand img{width:46px;height:52px;object-fit:contain}.back{text-decoration:none;color:var(--red);font-weight:800}
.wrap{max-width:1240px;margin:auto;padding:24px 20px 60px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}.controls{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px;align-items:end}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:800}.input{border:1px solid #d1d5db;border-radius:12px;padding:10px 12px;background:#fff}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--red);color:#fff}.secondary{background:#fff;color:var(--red);border:1px solid #fecdd3}.msg{font-size:13px;color:var(--muted);margin-top:8px}
.preview-shell{overflow:auto;background:#dfe3e7;border-radius:16px;padding:18px;container-type:inline-size}
.pages{display:flex;flex-direction:column;gap:18px;align-items:center}
.page-wrap{position:relative;display:flex;justify-content:center;align-items:flex-start}
.page{background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:8mm;overflow:hidden;display:flex;flex-direction:column;transform-origin:top left}
.page.portrait{width:210mm;height:297mm}
.page.landscape{width:297mm;height:210mm}
.page-title{flex:0 0 auto;background:var(--red);color:#fff;font-weight:900;padding:8px 11px;margin-bottom:6px;font-size:15px;line-height:1.2}
.page-content{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:auto;gap:7px;align-content:start;flex:1;min-height:0}
.landscape .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.page-content>table{height:100%}.sheet{border:2px solid var(--red);break-inside:avoid;page-break-inside:avoid;overflow:hidden;display:flex;flex-direction:column;min-height:0}.sheet-title{background:var(--red);color:#fff;font-weight:800;text-align:center;padding:8px 10px;font-size:14px;line-height:1.2;white-space:nowrap;overflow:visible}.sheet-body{display:grid;grid-template-columns:88px 1fr;min-height:170px;flex:1}.photo{border-right:1px solid #d1d5db;display:flex;align-items:center;justify-content:center;padding:7px}.photo img{width:100%;height:100%;max-height:155px;object-fit:contain}.empty{font-size:11px;color:#9ca3af;text-align:center}
table{width:100%;border-collapse:collapse;table-layout:auto}
th,td{
  border:1px solid #d1d5db;
  padding:5px 7px;
  font-size:9.2px;
  line-height:1.2;
  height:27px;
  vertical-align:middle;
  white-space:nowrap;
  overflow:visible;
  word-break:normal;
  overflow-wrap:normal
}
th{height:29px}
.portrait th,.portrait td{font-size:8.8px;padding:4px 6px;height:26px}
.landscape th,.landscape td{font-size:9.4px;padding:5px 7px;height:27px}th{background:var(--red);color:#fff;font-weight:800}td.num{text-align:center;font-weight:700}.note{background:#ffef57;color:#d91d0b;font-size:9.2px;font-weight:800;padding:6px 8px;line-height:1.25;white-space:normal}.state{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:1180px){.wrap{max-width:100%;padding:20px 14px 50px}.controls{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.topin{padding:8px 14px}.brand{font-size:19px}.brand img{width:38px;height:44px}.preview-shell{padding:12px}.panel{padding:14px}}
@media(max-width:680px){.controls{grid-template-columns:1fr}.wrap{padding:14px 8px 40px}.preview-shell{padding:8px;border-radius:10px}.btn{width:100%}.topin{align-items:flex-start;flex-wrap:wrap}.back{font-size:13px}}
@media(max-width:430px){.brand{font-size:17px}.field label{font-size:12px}.input,.btn{padding:9px 10px}.panel{border-radius:12px}}
@media print{.top,.panel{display:none!important}.wrap{max-width:none;padding:0}.preview-shell{padding:0;background:#fff;overflow:visible}.pages{display:block}.page-wrap{display:block;width:auto!important;height:auto!important}.page{box-shadow:none;margin:0;transform:none!important;break-after:page;page-break-after:always}.page:last-child{break-after:auto;page-break-after:auto}@page{margin:0}}
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
<header class="top"><div class="topin"><div class="brand"><img src="assets/yothe-cat.svg" alt="Yothé"><span>Yothé Export</span></div><a class="back" href="admin.html">← กลับ Admin</a></div></header>
<main class="wrap">
<section class="panel">
  <div class="controls">
    <div class="field"><label>หัวข้อ</label><select id="dataset" class="input"><option value="production">สูตรการผลิต</option><option value="drinks">สูตรชงเครื่องดื่ม</option><option value="expiry">วันหมดอายุ</option><option value="toppings">Topping</option></select></div>
    <div class="field"><label>กระดาษ</label><select id="orientation" class="input"><option value="portrait">A4 แนวตั้ง</option><option value="landscape">A4 แนวนอน</option></select></div>
    <button id="pngBtn" class="btn primary">Export PNG ความคมชัดสูง</button>
    <button id="pdfBtn" class="btn secondary">Export PDF</button>
  </div>
  <div id="msg" class="msg">เลือกหัวข้อที่ต้องการ Export</div>
</section>
<div class="preview-shell"><div id="pages" class="pages"><section class="page portrait"><div class="state">กำลังโหลดข้อมูล...</div></section></div></div>
</main>
<script>
const ADMIN_API="https://hcswjuemjluozmyejhnu.supabase.co/functions/v1/yothe-admin";
let pin=sessionStorage.getItem("yothe_admin_pin")||"",drinkMeta={};
function esc(v=""){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
async function api(payload){const r=await fetch(ADMIN_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...payload,pin})});const d=await r.json().catch(()=>({error:"Invalid response"}));if(!r.ok)throw new Error(d.error||"เกิดข้อผิดพลาด");return d}
function groupBy(rows,keyFn){const g={};for(const r of rows){const k=keyFn(r);(g[k]??=[]).push(r)}return g}
async function load(){
  if(!pin){location.href="admin.html";return}
  const ds=document.getElementById("dataset").value,msg=document.getElementById("msg");
  document.getElementById("pages").innerHTML='<div class="page-wrap"><section class="page '+document.getElementById("orientation").value+'"><div class="state">กำลังโหลดข้อมูล...</div></section></div>';fitPreviewPages();
  try{
    let rows;
    if(ds==="drinks"){
      const [a,b]=await Promise.all([api({action:"list",dataset:"drinks"}),api({action:"list",dataset:"drink_meta"})]);
      rows=a.data||[];drinkMeta=Object.fromEntries((b.data||[]).map(x=>[x.recipe_id,x]));
    }else rows=(await api({action:"list",dataset:ds})).data||[];
    await render(ds,rows);
    msg.textContent="พร้อม Export • "+rows.length+" รายการ • "+document.querySelectorAll("#pages .page").length+" หน้า A4";
  }catch(e){
    document.getElementById("pages").innerHTML='<div class="page-wrap"><section class="page '+document.getElementById("orientation").value+'"><div class="state">'+esc(e.message)+'</div></section></div>';fitPreviewPages();
    msg.textContent=e.message;
  }
}
function makePage(title){
  const ori=document.getElementById("orientation").value,p=document.createElement("section"),wrap=document.createElement("div");
  p.className="page "+ori;
  wrap.className="page-wrap";
  p.innerHTML='<div class="page-title">'+esc(title)+'</div><div class="page-content"></div>';
  wrap.appendChild(p);document.getElementById("pages").appendChild(wrap);
  requestAnimationFrame(fitPreviewPages);
  return p;
}
function fitPreviewPages(){
  const shell=document.querySelector(".preview-shell");if(!shell)return;
  const avail=Math.max(280,shell.clientWidth-16);
  document.querySelectorAll(".page-wrap").forEach(w=>{
    const p=w.querySelector(".page");if(!p)return;
    p.style.transform="none";w.style.width="auto";w.style.height="auto";
    const naturalW=p.offsetWidth,naturalH=p.offsetHeight;
    const scale=Math.min(1,avail/naturalW);
    p.style.transform="scale("+scale+")";
    w.style.width=(naturalW*scale)+"px";
    w.style.height=(naturalH*scale)+"px";
  });
}
function makeGridPage(title){
  const p=makePage(title),g=document.createElement("div");g.className="grid";p.querySelector(".page-content").appendChild(g);return {page:p,grid:g};
}
function pageOverflow(page){return page.scrollHeight>page.clientHeight+1}
function drinkSheet(id,items){
  items=[...items].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  const f=items[0]||{},m=drinkMeta[id]||{},tops=items.filter(x=>String(x.component_type||"").toLowerCase()==="topping").map(x=>x.sort_order||9999),firstTop=tops.length?Math.min(...tops):null;
  const a=document.createElement("article");a.className="sheet";
  a.innerHTML='<div class="sheet-title">'+esc(f.menu_name||id)+'</div><div class="sheet-body"><div class="photo">'+(m.image_url?'<img src="'+esc(m.image_url)+'" crossorigin="anonymous">':'<div class="empty">ยังไม่มีรูป</div>')+'</div><div><table><thead><tr><th>วัตถุดิบ</th><th>'+esc(m.size_label||"17 oz.(IB)")+'</th><th>หน่วย</th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+(firstTop!==null&&x.sort_order===firstTop?'<b style="color:#8b1aa8">Topping</b><br>':'')+esc(x.ingredient||"")+'</td><td class="num">'+esc(x.quantity??"-")+'</td><td class="num">'+esc(x.unit||"-")+'</td></tr>').join("")+'</tbody></table>'+(m.note?'<div class="note">'+esc(m.note)+'</div>':'')+'</div></div>';
  return a;
}
function productionSheet(name,items){
  const a=document.createElement("article");a.className="sheet";
  a.innerHTML='<div class="sheet-title">'+esc(name)+'</div><table><thead><tr><th>วัตถุดิบ</th><th>จำนวน</th><th>หน่วย</th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+esc(x.ingredient||"")+'</td><td class="num">'+esc(x.quantity??"-")+'</td><td class="num">'+esc(x.unit||"-")+'</td></tr>').join("")+'</tbody></table>';
  return a;
}
function toppingSheet(name,items){
  const a=document.createElement("article");a.className="sheet";
  a.innerHTML='<div class="sheet-title">'+esc(name)+'</div><table><thead><tr><th>รายการ</th><th>จำนวน</th><th>หน่วย</th><th>ราคา</th></tr></thead><tbody>'+items.map(r=>'<tr><td>'+esc(r.item_name||r.name||"")+'</td><td class="num">'+esc(r.quantity??"-")+'</td><td class="num">'+esc(r.unit||"-")+'</td><td class="num">'+(r.price_baht!=null?esc(r.price_baht)+" บาท":"-")+'</td></tr>').join("")+'</tbody></table>';
  return a;
}
async function packSheets(title,sheets){
  document.getElementById("pages").innerHTML="";
  let {page,grid}=makeGridPage(title);
  for(const sheet of sheets){
    grid.appendChild(sheet);
    await new Promise(r=>requestAnimationFrame(r));
    if(pageOverflow(page) && grid.children.length>1){
      grid.removeChild(sheet);
      ({page,grid}=makeGridPage(title));
      grid.appendChild(sheet);
      await new Promise(r=>requestAnimationFrame(r));
    }
  }
}
async function renderExpiry(rows){
  document.getElementById("pages").innerHTML="";
  let page=makePage("วันหมดอายุ"),content=page.querySelector(".page-content");
  const makeTable=()=>{const t=document.createElement("table");t.innerHTML='<thead><tr><th>รายการ</th><th>หมวด</th><th>การจัดเก็บ</th><th>ยังไม่เปิด</th><th>หลังเปิด</th><th>หน่วย</th></tr></thead><tbody></tbody>';content.appendChild(t);return t};
  let table=makeTable(),tbody=table.querySelector("tbody");
  for(const r of rows){
    const tr=document.createElement("tr");tr.innerHTML='<td>'+esc(r.item_name||"")+'</td><td>'+esc(r.category||"")+'</td><td>'+esc(r.storage_condition||"")+'</td><td>'+esc(r.shelf_life_unopened||"-")+'</td><td>'+esc(r.shelf_life_opened||"-")+'</td><td>'+esc(r.unit||"")+'</td>';
    tbody.appendChild(tr);await new Promise(x=>requestAnimationFrame(x));
    if(pageOverflow(page) && tbody.children.length>1){
      tbody.removeChild(tr);page=makePage("วันหมดอายุ");content=page.querySelector(".page-content");table=makeTable();tbody=table.querySelector("tbody");tbody.appendChild(tr);
    }
  }
}
async function render(ds,rows){
  if(ds==="expiry"){await renderExpiry(rows);return}
  let entries,title,builder;
  if(ds==="drinks"){const g=groupBy(rows,r=>r.recipe_id||"NO-ID");entries=Object.entries(g);title="สูตรชงเครื่องดื่ม";builder=([id,items])=>drinkSheet(id,items)}
  else if(ds==="production"){const g=groupBy(rows,r=>r.recipe_name||"ไม่ระบุชื่อ");entries=Object.entries(g);title="สูตรการผลิต";builder=([name,items])=>productionSheet(name,items)}
  else {const g=groupBy(rows,r=>(r.category||"Topping")+" • "+(r.subcategory||"ทั่วไป"));entries=Object.entries(g);title="Topping";builder=([name,items])=>toppingSheet(name,items)}
  const sheets=entries.map(builder);
  await packSheets(title,sheets);
  const imgs=[...document.querySelectorAll("#pages img")];
  await Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=img.onerror=r})));
}
async function pageCanvas(el){
  if(document.fonts?.ready)await document.fonts.ready;
  const old=el.style.transform;el.style.transform="none";
  await new Promise(r=>requestAnimationFrame(r));
  const canvas=await html2canvas(el,{scale:3,useCORS:true,allowTaint:false,backgroundColor:"#ffffff",logging:false,width:el.scrollWidth,height:el.scrollHeight,windowWidth:el.scrollWidth,windowHeight:el.scrollHeight});
  el.style.transform=old;fitPreviewPages();
  return canvas;
}
document.getElementById("pngBtn").onclick=async()=>{
  const msg=document.getElementById("msg");
  try{
    const pages=[...document.querySelectorAll("#pages .page")],ds=document.getElementById("dataset").value;
    msg.textContent="กำลัง Export PNG "+pages.length+" หน้า...";
    for(let i=0;i<pages.length;i++){
      const canvas=await pageCanvas(pages[i]),a=document.createElement("a");
      a.href=canvas.toDataURL("image/png",1);
      a.download="Yothe_"+ds+"_A4_page_"+String(i+1).padStart(2,"0")+".png";
      document.body.appendChild(a);a.click();a.remove();
      await new Promise(r=>setTimeout(r,250));
    }
    msg.textContent="Export PNG สำเร็จ "+pages.length+" หน้า A4";
  }catch(e){msg.textContent="Export PNG ไม่สำเร็จ: "+e.message}
};
document.getElementById("pdfBtn").onclick=async()=>{
  const msg=document.getElementById("msg");
  try{
    const pages=[...document.querySelectorAll("#pages .page")],ds=document.getElementById("dataset").value,ori=document.getElementById("orientation").value==="landscape"?"landscape":"portrait",{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:ori,unit:"mm",format:"a4"}),pw=ori==="landscape"?297:210,ph=ori==="landscape"?210:297;
    msg.textContent="กำลัง Export PDF "+pages.length+" หน้า...";
    for(let i=0;i<pages.length;i++){
      const canvas=await pageCanvas(pages[i]),img=canvas.toDataURL("image/jpeg",0.96);
      if(i>0)pdf.addPage("a4",ori);
      pdf.addImage(img,"JPEG",0,0,pw,ph,undefined,"FAST");
    }
    pdf.save("Yothe_"+ds+"_A4_"+ori+".pdf");
    msg.textContent="Export PDF สำเร็จ "+pages.length+" หน้า A4";
  }catch(e){msg.textContent="Export PDF ไม่สำเร็จ: "+e.message}
};
document.getElementById("dataset").onchange=load;document.getElementById("orientation").onchange=load;window.addEventListener("resize",fitPreviewPages);load();
</script>
</body>
</html>
