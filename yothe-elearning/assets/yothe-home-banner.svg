<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="Yothé E-Learning Japanese Sakura Banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7f1"/>
      <stop offset=".48" stop-color="#fde7e2"/>
      <stop offset="1" stop-color="#f7d9d7"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e64a43"/><stop offset="1" stop-color="#bd2625"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".14"/></filter>
  </defs>

  <rect width="1600" height="700" rx="36" fill="url(#bg)"/>
  <circle cx="1360" cy="112" r="240" fill="#fff" opacity=".28"/>
  <circle cx="230" cy="620" r="230" fill="#fff" opacity=".24"/>

  <!-- distant Japan landscape -->
  <path d="M0 520 C180 470 320 500 470 460 C660 410 800 480 960 455 C1140 425 1320 470 1600 420 L1600 700 L0 700Z" fill="#f4c9c4"/>
  <path d="M930 420 L1085 220 L1240 420Z" fill="#f7f3ef"/>
  <path d="M1020 302 L1085 220 L1148 303 Q1088 275 1020 302Z" fill="#fff"/>

  <!-- torii -->
  <g transform="translate(1310 288)" fill="#c93632" opacity=".88">
    <rect x="-80" y="-4" width="250" height="22" rx="5"/>
    <rect x="-56" y="24" width="202" height="14" rx="4"/>
    <rect x="-26" y="28" width="22" height="180" rx="5"/>
    <rect x="93" y="28" width="22" height="180" rx="5"/>
  </g>

  <!-- sakura branches -->
  <path d="M0 90 C120 90 185 120 260 190 C315 242 390 265 470 274" fill="none" stroke="#7d4f3b" stroke-width="16" stroke-linecap="round"/>
  <path d="M1470 55 C1380 105 1340 142 1270 222" fill="none" stroke="#7d4f3b" stroke-width="14" stroke-linecap="round"/>
  <g fill="#f39aa8">
    <circle cx="86" cy="88" r="19"/><circle cx="132" cy="102" r="18"/><circle cx="178" cy="128" r="20"/>
    <circle cx="230" cy="166" r="18"/><circle cx="296" cy="217" r="21"/><circle cx="365" cy="249" r="17"/>
    <circle cx="1430" cy="77" r="20"/><circle cx="1380" cy="112" r="18"/><circle cx="1330" cy="162" r="21"/>
    <circle cx="1275" cy="218" r="18"/>
  </g>

  <!-- branding -->
  <g transform="translate(92 110)">
    <rect width="610" height="238" rx="28" fill="#fffdf9" opacity=".94" filter="url(#shadow)"/>
    <image href="yothe-cat.svg" x="28" y="32" width="122" height="150"/>
    <image href="yothe-wordmark.svg" x="165" y="38" width="335" height="92"/>
    <text x="168" y="157" font-family="Arial,'Noto Sans Thai',sans-serif" font-size="48" font-weight="800" fill="#c9302c">E-Learning</text>
    <text x="168" y="202" font-family="Arial,'Noto Sans Thai',sans-serif" font-size="24" font-weight="600" fill="#765e50">เรียนรู้ • สนุก • เติบโตไปด้วยกัน</text>
  </g>

  <!-- café sign -->
  <g transform="translate(830 88)" filter="url(#shadow)">
    <rect width="350" height="100" rx="18" fill="#fffdf8"/>
    <text x="175" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="900" fill="#c9302c">YOTHÉ CAFÉ</text>
  </g>

  <!-- drink cards -->
  <g transform="translate(770 390)">
    <g transform="translate(0 0)" filter="url(#shadow)">
      <rect width="165" height="210" rx="26" fill="#fffdf8"/>
      <path d="M38 50 H128 L115 177 H51Z" fill="#7fc8ef"/>
      <path d="M43 86 H123 L115 177 H51Z" fill="#79b86f"/>
      <rect x="77" y="20" width="10" height="42" rx="5" fill="#785641"/>
      <text x="82" y="198" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#a33732">Matcha</text>
    </g>
    <g transform="translate(190 0)" filter="url(#shadow)">
      <rect width="165" height="210" rx="26" fill="#fffdf8"/>
      <path d="M38 50 H128 L115 177 H51Z" fill="#ffc857"/>
      <path d="M43 95 H123 L115 177 H51Z" fill="#f6a23d"/>
      <circle cx="61" cy="79" r="13" fill="#f2cf70"/><circle cx="87" cy="72" r="15" fill="#ffe59e"/><circle cx="110" cy="80" r="13" fill="#f3ce6c"/>
      <rect x="77" y="20" width="10" height="42" rx="5" fill="#785641"/>
      <text x="82" y="198" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#a33732">Mango</text>
    </g>
    <g transform="translate(380 0)" filter="url(#shadow)">
      <rect width="165" height="210" rx="26" fill="#fffdf8"/>
      <path d="M38 50 H128 L115 177 H51Z" fill="#e6b892"/>
      <path d="M43 95 H123 L115 177 H51Z" fill="#6b4636"/>
      <path d="M48 74 Q84 44 120 74" fill="#f2dfcb"/>
      <rect x="77" y="20" width="10" height="42" rx="5" fill="#785641"/>
      <text x="82" y="198" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#a33732">Chocolate</text>
    </g>
  </g>

  <!-- foreground petals -->
  <g fill="#f29bab" opacity=".9">
    <ellipse cx="720" cy="110" rx="11" ry="18" transform="rotate(28 720 110)"/>
    <ellipse cx="760" cy="250" rx="10" ry="16" transform="rotate(-30 760 250)"/>
    <ellipse cx="1240" cy="96" rx="10" ry="17" transform="rotate(35 1240 96)"/>
    <ellipse cx="1460" cy="335" rx="11" ry="18" transform="rotate(-28 1460 335)"/>
    <ellipse cx="650" cy="580" rx="9" ry="15" transform="rotate(22 650 580)"/>
  </g>
</svg>