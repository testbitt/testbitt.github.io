<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Kamu Kamu Standard Libary</title>

<style>html,body{margin:0;min-height:100%;background:#f6faf7}body{min-height:100vh}</style>
</head>
<body>
<script>
const KSL_NEW_API='https://script.google.com/macros/s/AKfycbwtHxjbAvvxLPezMt6GljkyxxVdSPmaSfXSjL1UeoNOQWeUVNihygmsFPaAutfuN6JE/exec';
(function installKslApiRouter(){
  if(window.__KSL_API_ROUTER_V61__)return;
  window.__KSL_API_ROUTER_V61__=true;
  window.__KSL_API_ENDPOINT__=KSL_NEW_API;
  const routeUrl=(raw)=>{try{const src=String(raw||'');const u=new URL(src,location.href);if(u.hostname==='script.google.com'&&/^\/macros\/s\/[^/]+\/exec\/?$/.test(u.pathname)){const next=new URL(KSL_NEW_API);next.search=u.search;next.hash=u.hash;return next.href}return src}catch(_){return raw}};
  window.__KSL_ROUTE_API__=routeUrl;
  try{const nativeFetch=window.fetch.bind(window);window.fetch=function(input,init){try{if(typeof Request!=='undefined'&&input instanceof Request){const routed=routeUrl(input.url);if(routed!==input.url)input=new Request(routed,input)}else input=routeUrl(input)}catch(_){}return nativeFetch(input,init)}}catch(_){}
  try{const nativeOpen=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(method,url){const args=[...arguments];args[1]=routeUrl(url);return nativeOpen.apply(this,args)}}catch(_){}
  try{if(typeof navigator.sendBeacon==='function'){const nativeBeacon=navigator.sendBeacon.bind(navigator);navigator.sendBeacon=function(url,data){return nativeBeacon(routeUrl(url),data)}}}catch(_){}
  try{const nativeAppend=Node.prototype.appendChild;Node.prototype.appendChild=function(child){try{if(child&&child.tagName==='SCRIPT'&&child.src){const routed=routeUrl(child.src);if(routed!==child.src)child.src=routed}}catch(_){}return nativeAppend.call(this,child)};const nativeInsert=Node.prototype.insertBefore;Node.prototype.insertBefore=function(child,ref){try{if(child&&child.tagName==='SCRIPT'&&child.src){const routed=routeUrl(child.src);if(routed!==child.src)child.src=routed}}catch(_){}return nativeInsert.call(this,child,ref)}}catch(_){}
  console.info('[KSL] V6.3 API router ready',KSL_NEW_API);
})();
const KSL_ADMIN2_BOOT=(()=>{
  try{return new URLSearchParams(location.search).get('admin2')==='1'}catch(_){return false}
})();
async function ensureMainWebAccess(){
  if(KSL_ADMIN2_BOOT)return true;
  try{
    if(sessionStorage.getItem('KSL_MAIN_WEB_AUTH')==='1')return true;
  }catch(_){}
  const expected='28995a2c0d04b66d5c7c818536bb00cd1fc1ac422aea47627de0999782fee3f4';
  document.documentElement.style.visibility='visible';
  document.body.innerHTML=
    '<div id="kslMainGate" style="min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef7f2,#f8fbf9);font-family:system-ui,-apple-system,\'Noto Sans Thai\',Tahoma,sans-serif;color:#173e30">'+
      '<form id="kslMainGateForm" style="width:min(440px,100%);background:#fff;border:1px solid #cfe4d9;border-radius:22px;padding:28px;box-shadow:0 14px 40px rgba(23,76,57,.10)">'+
        '<div style="font-size:12px;font-weight:900;letter-spacing:.7px;color:#1a7453">KAMU KAMU • KSL</div>'+
        '<h1 style="margin:6px 0 8px;font-size:25px;color:#174c39">เข้าสู่ระบบ</h1>'+
        '<p style="margin:0 0 18px;color:#6b8178;font-size:13px">กรอกรหัสผ่านเพื่อเข้าใช้งานระบบ</p>'+
        '<label for="kslMainPass" style="display:block;font-size:12px;font-weight:800;margin-bottom:6px">รหัสผ่าน</label>'+
        '<input id="kslMainPass" type="password" inputmode="numeric" autocomplete="current-password" required autofocus style="width:100%;box-sizing:border-box;border:1px solid #bfdccc;border-radius:11px;padding:12px 13px;font-size:16px;outline:none">'+
        '<button type="submit" style="width:100%;margin-top:12px;border:0;border-radius:11px;padding:12px 14px;background:#176b4d;color:#fff;font-weight:900;font-size:15px;cursor:pointer">เข้าสู่ระบบ</button>'+
        '<div id="kslMainGateMsg" style="min-height:20px;margin-top:10px;font-size:12px;color:#a33"></div>'+
      '</form>'+
    '</div>';
  const sha256=async s=>{
    const bytes=new TextEncoder().encode(String(s||''));
    const hash=await crypto.subtle.digest('SHA-256',bytes);
    return [...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('');
  };
  return await new Promise(resolve=>{
    document.getElementById('kslMainGateForm').addEventListener('submit',async e=>{
      e.preventDefault();
      const input=document.getElementById('kslMainPass');
      const msg=document.getElementById('kslMainGateMsg');
      const digest=await sha256(input.value);
      if(digest!==expected){
        msg.textContent='รหัสผ่านไม่ถูกต้อง';
        input.select();
        return;
      }
      try{sessionStorage.setItem('KSL_MAIN_WEB_AUTH','1')}catch(_){}
      resolve(true);
    });
  });
}
function installOitoFooter(){
  if(document.getElementById('kslOitoFooter'))return;
  const footer=document.createElement('footer');
  footer.id='kslOitoFooter';
  footer.textContent='@ 2026 Powered By : OITO';
  footer.style.cssText='width:100%;box-sizing:border-box;text-align:center;padding:14px 12px 18px;margin-top:18px;color:#667a72;font:700 12px/1.4 system-ui,-apple-system,"Noto Sans Thai",Tahoma,sans-serif;background:transparent';
  document.body.appendChild(footer);
}
(async()=>{
  await ensureMainWebAccess();
  const VERSION='v63-expiry-correct-date';
  const SHELL_CACHE_KEY='KSL_APP_SHELL_V52';
  const SHELL_FIRST_BOOT_RELOAD_KEY='KSL_SHELL_FIRST_BOOT_RELOADED_V1';
  let shellFetchedFresh=false;
  const CORE_PATCHES=['patch-v39.js?v=61','patch-v40.js?v=61','patch-v41.js?v=61','patch-v42.js?v=61','patch-v44.js?v=61','patch-v45.js?v=61','patch-v46.js?v=61','patch-v48.js?v=61','patch-v49.js?v=61','patch-v56.js?v=61','patch-v57.js?v=61','patch-v60.js?v=63-upload-live-2'];
  function loadOrderedScripts(sources){const promises=[];for(const src of sources){const s=document.createElement('script');s.src=src;s.async=false;s.fetchPriority='high';promises.push(new Promise((resolve,reject)=>{s.onload=()=>resolve(src);s.onerror=()=>reject(new Error('โหลด '+src+' ไม่สำเร็จ'))}));document.body.appendChild(s)}return Promise.all(promises)}
  function loadHQInBackground(){const run=()=>{const s=document.createElement('script');s.src='patch-v50.js?v=61';s.async=true;s.onerror=()=>console.warn('Banner HQ โหลดไม่สำเร็จ ใช้ภาพสำรองแทน');document.body.appendChild(s)};if('requestIdleCallback'in window)requestIdleCallback(run,{timeout:1800});else setTimeout(run,650)}
  async function loadSafeOptionalPatch(src){const res=await fetch(src,{cache:'no-store'});if(!res.ok)throw new Error('โหลด '+src+' ไม่สำเร็จ ('+res.status+')');let code=await res.text();const observerLoop=/new\s+MutationObserver\s*\(\s*\(\)\s*=>\s*queueMicrotask\s*\(\s*install\s*\)\s*\)\s*\.observe\s*\(\s*document\.documentElement\s*,\s*\{\s*childList\s*:\s*true\s*,\s*subtree\s*:\s*true\s*\}\s*\)\s*;?/g;code=code.replace(observerLoop,'/* KSL V6.3 safe loader: recursive MutationObserver disabled */');const s=document.createElement('script');s.textContent=code+'\n//# sourceURL='+src.replace(/[^a-zA-Z0-9._/-]/g,'_');document.body.appendChild(s);s.remove();return src}
  function loadV63InBackground(){const run=async()=>{try{await loadSafeOptionalPatch('patch-v62.js?v=63-safe-1');await loadSafeOptionalPatch('patch-v63.js?v=63-safe-1');await loadSafeOptionalPatch('patch-v63-start-expiry.js?v=63-start-2');await loadSafeOptionalPatch('patch-v63-expiry-result.js?v=63-result-1');await loadSafeOptionalPatch('patch-v63-correct-expiry.js?v=63-correct-1');await loadSafeOptionalPatch('patch-v63-history.js?v=63-history-1');await loadSafeOptionalPatch('patch-v63-inspection-meta.js?v=63-meta-1');await loadSafeOptionalPatch('patch-v63-inspection-meta-fix.js?v=63-meta-fix-1');await loadSafeOptionalPatch('patch-v63-custom-templates.js?v=63-template-1');await loadSafeOptionalPatch('ksl-v63-deploy-check.txt?v=63-flow-multi-1');await loadSafeOptionalPatch('patch-v63-clear-fix.js?v=63-clear-1');await loadSafeOptionalPatch('patch-v63-template-dropdown.js?v=63-template-dropdown-2');await loadSafeOptionalPatch('patch-v63-production-upload-fix.js?v=63-production-direct-3');await loadSafeOptionalPatch('patch-v63-media-builder.js?v=63-media-builder-72');window.__KSL_RELEASE__='6.3';console.info('[KSL] V6.3 safe patches + correct expiry date + online history + inspection meta + custom templates + staged report flow + clear fix + template dropdown + all uploads live refresh + admin media builder ready')}catch(err){console.error('[KSL] V6.3 optional patch load failed',err)}};setTimeout(run,220)}
  async function getShell(){
    try{
      const cached=localStorage.getItem(SHELL_CACHE_KEY);
      if(cached&&/<html/i.test(cached))return cached;
    }catch(_){}
    const files=['payload-01.txt','payload-02.txt','payload-03.txt','payload-04.txt','payload-05.txt','payload-06.txt','payload-07.txt','payload-08.txt'];
    const parts=await Promise.all(files.map(f=>fetch(f+'?v='+VERSION,{cache:'force-cache'}).then(r=>{
      if(!r.ok)throw new Error('โหลด '+f+' ไม่สำเร็จ ('+r.status+')');
      return r.text();
    })));
    const bin=atob(parts.join(''));
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    if(!('DecompressionStream'in window))throw new Error('กรุณาใช้ Chrome หรือ Edge รุ่นล่าสุด');
    const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    if(!/<html/i.test(html))throw new Error('ไฟล์หลักสูตรไม่สมบูรณ์');
    try{localStorage.setItem(SHELL_CACHE_KEY,html)}catch(_){}
    shellFetchedFresh=true;
    return html;
  }
  function showFatal(err){console.error(err);document.documentElement.style.visibility='visible';document.body.innerHTML='<div style="font-family:system-ui;padding:24px;color:#173d30">เปิดระบบไม่สำเร็จ กรุณาปิดแท็บแล้วเปิดใหม่อีกครั้ง</div>'}
  try{
    let html=await getShell();

    // First uncached visit: after the shell has been downloaded and cached,
    // perform one automatic reload so all embedded app scripts boot from a
    // stable cached document. This replaces the manual Refresh users needed.
    if(shellFetchedFresh){
      let alreadyReloaded=false;
      try{alreadyReloaded=sessionStorage.getItem(SHELL_FIRST_BOOT_RELOAD_KEY)==='1'}catch(_){}
      if(!alreadyReloaded){
        try{sessionStorage.setItem(SHELL_FIRST_BOOT_RELOAD_KEY,'1')}catch(_){}
        location.reload();
        return;
      }
    }
    try{sessionStorage.removeItem(SHELL_FIRST_BOOT_RELOAD_KEY)}catch(_){}

    const bootHide='<style id="kslBootHide">html{visibility:hidden!important;background:#f6faf7!important}</style>';
    html=html.replace(/<head([^>]*)>/i,'<head$1>'+bootHide);
    document.open();document.write(html);document.close();

    const hide=document.createElement('style');
    hide.id='kslPermanentHide';
    hide.textContent='#loginGate,#userPill,#resultProfileStrip{display:none!important}';
    document.head.appendChild(hide);

    if(KSL_ADMIN2_BOOT){
      // Admin2 fast path: Media Builder does not need the full KSL patch chain.
      // Skip CORE_PATCHES, HQ banner, expiry/inspection/template/upload patches,
      // and the 900ms home-banner readiness wait.
      const cover=document.createElement('div');
      cover.id='kslAdmin2BootCover';
      cover.style.cssText='position:fixed;inset:0;z-index:2147482500;background:#f5faf7;display:grid;place-items:center;font-family:system-ui,-apple-system,"Noto Sans Thai",Tahoma,sans-serif;color:#175941;font-weight:900;font-size:16px';
      cover.textContent='กำลังเปิด Admin2...';
      document.body.appendChild(cover);
      document.getElementById('kslBootHide')?.remove();
      document.documentElement.style.visibility='visible';

      await loadOrderedScripts(['patch-v63-media-builder.js?v=63-media-builder-72']);
      installOitoFooter();
      document.getElementById('kslAdmin2BootCover')?.remove();
      window.__KSL_RELEASE__='6.3-admin2-fast';
      if(history.replaceState)history.replaceState(null,'','/app.html?restore=63&admin2=1');
      console.info('[KSL] Admin2 fast path ready');
      return;
    }

    await loadOrderedScripts(CORE_PATCHES);
    if(typeof window.goPage==='function')window.goPage('home');else if(typeof goPage==='function')goPage('home');
    await new Promise(resolve=>{
      const start=performance.now();
      const tick=()=>{
        const ready=document.querySelector('#home .ksl-v49-banner-wrap');
        if(ready||performance.now()-start>900)return resolve();
        requestAnimationFrame(tick);
      };
      tick();
    });
    document.getElementById('kslBootHide')?.remove();
    document.documentElement.style.visibility='visible';
    installOitoFooter();
    window.scrollTo(0,0);
    loadHQInBackground();
    loadV63InBackground();
    if(history.replaceState)history.replaceState(null,'','/');
  }catch(err){showFatal(err)}
})();
</script>
